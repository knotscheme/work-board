<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>やることボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F5F2; --surface:#FFFFFF; --line:#E1E3DE; --ink:#1D2127; --muted:#666C74;
  --accent:#2E4C88; --accent-soft:#E6ECF7;
  --urgent:#B93A12; --urgent-soft:#FBEAE3;
  --done:#2D7A4C; --done-soft:#E3F2E8;
  --warn:#9A6A0B; --warn-soft:#FBF1DC;
  --idle:#C9CCC6; --today:#FFF8E6;
  --scene-bg:#DDE3E8; --floor:#C9C2B6; --wall:#EEF0EC; --wood:#B0835A;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#15181D; --surface:#1D2128; --line:#2E333C; --ink:#E8EAED; --muted:#9AA0A9;
    --accent:#8FAEE8; --accent-soft:#25304A;
    --urgent:#F08A62; --urgent-soft:#3A2219;
    --done:#6CC892; --done-soft:#1B3326;
    --warn:#E3B556; --warn-soft:#352B14;
    --idle:#3A3F48; --today:#2A2618;
    --scene-bg:#1A1F27; --floor:#3A3631; --wall:#262B33; --wood:#7A5A3E;
  }
}
*{box-sizing:border-box}
.wrap,.sec{grid-template-columns:minmax(0,1fr)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:28px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.55rem}
h2{font-size:1.1rem;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-size:.8rem;font-weight:500;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{display:grid;gap:14px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header + tabs */
.top{display:grid;grid-template-columns:1fr auto;gap:16px 20px;align-items:end}
.top p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.count{background:var(--urgent-soft);color:var(--urgent);border-radius:10px;padding:10px 16px;display:grid;gap:2px;text-align:right}
.count .lbl{font-size:.76rem;font-weight:700;letter-spacing:.04em}
.count .num{font-size:1.7rem;font-weight:700;line-height:1.1}
.count .num span{font-size:.9rem;margin-left:2px}
.count .sub{font-size:.74rem}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;justify-self:start;grid-column:1/-1}
.tabs button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:700;font-size:.86rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:.75rem;color:var(--muted);font-weight:700;text-align:center;letter-spacing:.06em}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:104px;display:flex;flex-direction:column;gap:5px}
.day.past{opacity:.55}
.day.today{background:var(--today);border-color:var(--warn)}
.day .dn{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.day.today .dn b{color:var(--warn)}
.day.sun .dn{color:var(--urgent)}
.day.wkend{background:var(--bg)}
.day .dn .off{font-size:.72rem;font-weight:700}
.ev{font:inherit;color:inherit;text-align:left;width:100%;border:0;cursor:pointer;font-size:.78rem;line-height:1.45;border-radius:5px;padding:4px 6px;background:var(--accent-soft);border-left:3px solid var(--accent)}
.ev.deadline{background:var(--warn-soft);border-left-color:var(--warn)}
.ev.event{background:var(--urgent-soft);border-left-color:var(--urgent);font-weight:700}
.ev.duty{background:var(--bg);border-left-color:var(--muted);color:var(--muted);font-weight:700}
.ev .tm{font-family:var(--mono);margin-right:4px}
.addev{border:1px dashed var(--line);background:none;border-radius:6px;font-size:.74rem;color:var(--muted);padding:3px 0;margin-top:auto}
.addev:hover{border-color:var(--accent);color:var(--accent)}
.tbtn{font:inherit;color:inherit;text-align:left;border:0;background:none;padding:6px;margin:-6px;border-radius:8px;width:calc(100% + 12px);cursor:pointer}
.tbtn:hover{background:var(--bg)}
.tagrow{display:flex;gap:4px;flex-wrap:wrap}
.tag.cat{background:var(--bg);color:var(--muted)}
.tag.whotag{background:var(--done-soft);color:var(--done)}
.ev .who{display:inline-block;font-size:.68rem;font-weight:700;background:var(--done-soft);color:var(--done);border-radius:999px;padding:0 6px;margin-right:5px;vertical-align:1px}
.whofilter{display:flex;flex-wrap:wrap;gap:6px}
.whofilter button,.whopick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.whofilter button[aria-pressed="true"],.whopick button[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.whopick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag.web{background:var(--warn-soft);color:var(--warn)}
.tag.最優先{background:var(--urgent);color:var(--surface)}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.h2row .btn{padding:6px 14px}
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));display:grid;gap:12px;max-height:88vh;overflow:auto;box-shadow:0 -6px 24px rgb(0 0 0 / .2)}
.sheet h3{font-size:1.05rem}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:.76rem;color:var(--muted);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=date],input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.seg.wide{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg.wide button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-size:.84rem;font-weight:700;color:var(--muted)}
.seg.wide button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ok{color:var(--done);border-color:var(--done)}
.warnline{margin:0;font-size:.8rem;color:var(--warn)}
body.noscroll{overflow:hidden}
@media (min-width:761px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* pipeline */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.88rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-size:.76rem;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--bg)}
th.st,td.st{text-align:center;width:60px}
.code{font-family:var(--mono);font-size:.84rem;color:var(--accent);white-space:nowrap}
.name{font-weight:700}
.note{color:var(--muted);font-size:.82rem}
.pipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.pc-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pc-st{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.dotbtn{border:0;background:none;padding:8px 0 6px;border-radius:8px;display:grid;justify-items:center;gap:4px;min-height:52px}
.dotbtn span{font-size:.7rem;color:var(--muted);font-weight:700}
.dotbtn .dot{width:20px;height:20px}
.dotbtn:hover,.dotbtn:active{background:var(--accent-soft)}
.dotmenu{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgb(0 0 0 / .18);padding:6px;display:grid;min-width:170px}
.dotmenu .dm-h{font-size:.74rem;color:var(--muted);font-weight:700;padding:4px 8px}
.dotmenu button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;display:flex;gap:8px;align-items:center;font-size:.86rem}
.dotmenu button:hover,.dotmenu button:focus-visible{background:var(--bg)}
.dotmenu button[aria-current]{font-weight:700}
.pipe-note{font-size:.8rem;color:var(--muted)}
.pipe-note.err{color:var(--urgent)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--idle);vertical-align:middle}
.dot.done{background:var(--done)}
.dot.now{background:var(--surface);border:3px solid var(--accent)}
.dot.hot{background:var(--surface);border:3px solid var(--urgent)}
.dot.wait{background:var(--surface);border:3px dashed var(--warn)}

/* cards */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.card h3{font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.card h3 .mono{color:var(--muted);font-weight:500;font-size:.8rem}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:.88rem}
.task{display:grid;gap:3px}
.tag{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;justify-self:start}
.tag.最優先{background:var(--urgent);color:var(--surface)}
.tag.優先{background:var(--urgent-soft);color:var(--urgent)}
.tag.通常{background:var(--accent-soft);color:var(--accent)}
.tag.未分類,.tag.後回し,.tag.低{background:var(--bg);color:var(--muted)}
.meta{font-size:.74rem;color:var(--muted)}
.q{border-color:var(--warn)}
.q h3{color:var(--warn)}
.q ul{list-style:disc;padding-left:1.2em}
.done-list li{color:var(--muted)}
footer{color:var(--muted);font-size:.78rem}
.msg{max-width:520px;margin:80px auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}

/* office */
.office{position:relative;height:min(68vh,640px);min-height:420px;border-radius:12px;overflow:hidden;background:var(--scene-bg);border:1px solid var(--line);touch-action:none;user-select:none}
.office canvas{display:block;width:100%;height:100%;cursor:grab}
.office canvas.drag{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none}
.nm{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:.72rem;font-weight:700;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:1px 9px;display:flex;gap:6px;align-items:center;pointer-events:auto;cursor:pointer;box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.nm .b{font-family:var(--mono);border-radius:999px;padding:0 6px;font-size:.68rem;background:var(--accent-soft);color:var(--accent)}
.nm.decision{border-color:var(--warn)}
.nm.decision .b{background:var(--warn-soft);color:var(--warn)}
.nm.stale{border-color:var(--urgent);animation:blink 1.1s steps(2,start) infinite}
.nm.stale .b{background:var(--urgent);color:var(--surface)}
.nm.idle{opacity:.75}
.nm.today{border:2px solid #E8A800}
.nm .b.now{background:#E8A800;color:#1D2127}
.chip.today{color:#9A6A0B;border-color:#E8A800;background:#FFF4D1}
.nm.sel{outline:2px solid var(--accent)}
@keyframes blink{50%{border-color:var(--line)}}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:260px;font-size:.78rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:0 2px 8px rgb(0 0 0 / .15);pointer-events:none;transition:opacity .3s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.hud{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;display:flex;gap:6px;align-items:center}
.chip .mono{font-size:.8rem}
.chip.stale{color:var(--urgent);border-color:var(--urgent)}
.chip.decision{color:var(--warn);border-color:var(--warn)}
.chip.working{color:var(--accent)}
.chip[disabled]{opacity:.45;cursor:default}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.zoom button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:44px;font-weight:700;font-size:1rem;box-shadow:0 1px 4px rgb(0 0 0 / .12)}
.zoom button[data-z="all"]{font-size:.8rem;padding:0 10px}
.hint{position:absolute;bottom:10px;left:12px;font-size:.72rem;color:var(--muted);pointer-events:none}
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(360px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;overflow:auto;display:grid;gap:12px;align-content:start;box-shadow:0 4px 18px rgb(0 0 0 / .18)}
.panel .x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:1.2rem;line-height:1;padding:6px 8px;color:var(--muted)}
.panel h3{font-size:1.05rem;padding-right:28px}
.panel .state{font-size:.78rem;font-weight:700;justify-self:start;border-radius:999px;padding:2px 10px}
.state.working{background:var(--accent-soft);color:var(--accent)}
.state.decision{background:var(--warn-soft);color:var(--warn)}
.state.stale{background:var(--urgent-soft);color:var(--urgent)}
.state.idle{background:var(--bg);color:var(--muted)}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:.86rem}
.panel .lbl{font-size:.74rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools span{font-family:var(--mono);font-size:.72rem;background:var(--bg);border-radius:5px;padding:2px 7px}
.qbox{background:var(--warn-soft);border-radius:8px;padding:8px 10px;font-size:.84rem}

/* memo */
.memo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
.compose{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
textarea,input[type=text],input[type=password],input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.6}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 16px;font-weight:700;font-size:.88rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--urgent);border-color:var(--urgent)}
.btn[disabled]{opacity:.5;cursor:default}
.memos{display:grid;gap:10px}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.memo.pinned{border-color:var(--warn)}
.memo .body{white-space:pre-wrap;word-break:break-word;font-size:.9rem}
.memo .foot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.memo .acts{display:flex;gap:4px}
.memo .acts button{border:0;background:none;font-size:.78rem;padding:2px 6px;border-radius:5px;color:var(--muted)}
.memo .acts button:hover{background:var(--bg);color:var(--ink)}
.memo .acts .really{color:var(--urgent);font-weight:700}
.catpick{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem}
.catpick legend{font-size:.76rem;color:var(--muted);font-weight:700;padding:0;margin-bottom:4px}
.catpick label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.catpick input{accent-color:var(--accent);width:16px;height:16px}
.mfilter{display:flex;flex-wrap:wrap;gap:6px}
.mfilter button,.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;color:var(--muted)}
.mfilter button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.mfilter .mono{font-size:.74rem}
.seg{display:inline-flex;gap:4px}
.mgroup{display:grid;gap:10px}
.mgroup h3{font-size:.92rem;display:flex;gap:8px;align-items:baseline;padding-top:6px}
.mgroup h3 .mono{color:var(--muted);font-size:.78rem}
.mcats{display:flex;flex-wrap:wrap;gap:4px}
.mcats span{font-size:.7rem;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 8px}
.status{font-size:.8rem;color:var(--muted)}
.status.err{color:var(--urgent)}
.setup{background:var(--warn-soft);border-radius:10px;padding:14px 16px;display:grid;gap:8px;font-size:.86rem}
.setup ol{margin:0;padding-left:1.3em}

@media (max-width:760px){
  body{padding-block:14px calc(84px + env(safe-area-inset-bottom, 0px))}
  .wrap{gap:22px}
  h1{font-size:1.3rem}
  .top{gap:10px}
  .count{padding:8px 12px;grid-template-columns:1fr auto;align-items:baseline;column-gap:10px;justify-self:stretch}
  .count .num{font-size:1.35rem;grid-row:span 2}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;justify-self:stretch;width:100%;border-radius:0;border:0;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));justify-content:stretch;box-shadow:0 -2px 10px rgb(0 0 0 / .08)}
  .tabs{gap:2px;padding:4px 4px calc(4px + env(safe-area-inset-bottom, 0px))}
  .tabs button{flex:1;min-width:0;flex-direction:column;gap:2px;padding:7px 0 6px;font-size:.66rem;letter-spacing:0;border-radius:10px}
  .tabs svg{width:25px;height:25px}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  .day.past{display:none}
  .office{height:64vh;min-height:380px}
  .nm{font-size:.66rem;padding:0 7px}
  .hint{display:none}
  textarea{min-height:110px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .top{grid-template-columns:1fr}
  .count{text-align:left;justify-self:start}
  .cal{grid-template-columns:1fr}
  .dow{display:none}
  .day{min-height:0}
  .memo-grid{grid-template-columns:1fr}
  .panel{top:auto;height:55%}
}
@media (prefers-reduced-motion:reduce){.nm.stale{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="msg">読み込み中…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var app = document.getElementById('app');
var W = ['日','月','火','水','木','金','土'];
var REPO = 'knotscheme/work-board';
var ORDER = ['企画・サンプル','撮影','商品画像','動画','LP・文章','商品登録・在庫','事務・受注・発注','販促・SNS・イベント','OEM事業','アプリ開発','Web制作','クライアント案件','その他'];
var STALE_DAYS = 30;

/* ---------- utils ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fromB64(s){ s = s.replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,''); while(s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
function toB64(u){ var s = ''; for (var i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jpDate(x){ var d = new Date(x); return (d.getMonth()+1)+'/'+d.getDate()+'（'+W[d.getDay()]+'）'; }
function jpDateTime(x){ var d = new Date(x); return jpDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

async function decryptJSON(enc){
  var buf = await crypto.subtle.decrypt({name:'AES-GCM', iv: fromB64(enc.iv)}, cryptoKey, fromB64(enc.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function encryptJSON(obj){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv: iv}, cryptoKey, new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({v:1, iv: toB64(iv), ct: toB64(ct)});
}
function ghToken(){ return ls('wb_token'); }
function ghFile(file, method, body){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+file, {
    method: method, cache:'no-store',
    headers: {'Authorization':'Bearer '+ghToken(), 'Accept':'application/vnd.github+json'},
    body: body ? JSON.stringify(body) : undefined
  });
}
async function ghRead(file){
  var r = await ghFile(file, 'GET');
  if (r.status === 404) return {sha:null, data:null};
  if (!r.ok) throw new Error(r.status === 401 ? 'トークンが無効です。メモタブで設定し直してください。' : 'GitHub から読み込めませんでした（'+r.status+'）。');
  var j = await r.json();
  return {sha:j.sha, data: await decryptJSON(JSON.parse(atob(j.content.replace(/\n/g,''))))};
}

// Webで変更したファイルを読む（トークンがあれば GitHub API で最新、なければ公開ページから）
async function readWeb(file){
  if (ghToken()) return (await ghRead(file)).data;
  var r = await fetch(file + '?t=' + Date.now(), {cache:'no-store'});
  return r.ok ? decryptJSON(await r.json()) : null;
}
// 最新を読み直して mutate を当て、競合したらもう一度
async function ghUpdate(file, mutate, msg){
  for (var attempt = 0; attempt < 2; attempt++) {
    var cur = await ghRead(file);
    var next = mutate(cur.data);
    var body = {message: msg, content: btoa(await encryptJSON(next))};
    if (cur.sha) body.sha = cur.sha;
    var put = await ghFile(file, 'PUT', body);
    if (put.ok) return next;
    if (put.status !== 409 && put.status !== 422) throw new Error('保存できませんでした（'+put.status+'）。');
  }
  throw new Error('ほかの端末と同時に保存されました。もう一度お試しください。');
}

// 秘書がまだ取り込んでいないタスク操作を一覧に重ねる
var LABEL_SCORE = {'最優先':75, '優先':48, '通常':18, '低':6};
function mergeOps(base, ops){
  var list = base.map(function(t){ return Object.assign({}, t); }), seen = {};
  ops.forEach(function(o){
    if (seen[o.opId]) return; seen[o.opId] = 1;
    if (o.op === 'add') { if (!list.some(function(x){ return x.id === o.id; })) list.push({id:o.id, content:o.content, category:o.category, label:o.label, assignee:o.assignee || null, score:LABEL_SCORE[o.label] || 18, recorded:o.at, web:true}); return; }
    var t = list.filter(function(x){ return x.id === o.id; })[0]; if (!t) return;
    if (o.op === 'edit') { if ('assignee' in o) t.assignee = o.assignee || null; if (o.content) t.content = o.content; if (o.category) t.category = o.category; if (o.label) { t.label = o.label; t.score = LABEL_SCORE[o.label]; } t.web = true; }
    if (o.op === 'done') list = list.filter(function(x){ return x !== t; });
  });
  return list;
}

      bg.addEventListener('click', function(e){ if (e.target === bg) close(); });
    }
    bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
    bg.hidden = false; document.body.classList.add('noscroll');
    var sh = bg.querySelector('.sheet'); bind && bind(sh);

  }

  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  return {open:open, close:close};
})();

/* ---------- 部署の状態 ---------- */
function dayKey(offset){ var d = new Date(); d.setDate(d.getDate() + (offset||0)); return ymd(d); }
function eventCat(e){
  if (e.cat) return e.cat;
  var t = e.task && DATA.pending.filter(function(x){ return x.id === e.task; })[0];
  return t ? t.category : null;
}
function eventsOn(key){ return ((DATA.board && DATA.board.events) || []).filter(function(e){ return e.date === key; }); }
function isDutyDay(key){ return eventsOn(key).some(function(e){ return e.kind === 'duty'; }); }

var STAGE_CAT = {'企画':'企画・サンプル','撮影':'撮影','画像':'商品画像','LP':'LP・文章','登録':'商品登録・在庫','販促':'販促・SNS・イベント'};
// 品番がいま担当している工程：今週やる > 次の作業 > 待ち の順で最初のもの
function activeStage(p, stages){
  var order = ['hot','now','wait'];
  for (var k = 0; k < order.length; k++) {
    var j = (p.s || []).indexOf(order[k]);
    if (j >= 0) return {code:p.code, name:p.name, stage:stages[j], state:order[k], cat:STAGE_CAT[stages[j]]};
  }
  return null;
}

function deptStates(){
  var b = DATA.board || {}, now = Date.now(), out = {}, today = dayKey(0), soonEnd = dayKey(2);
  var events = b.events || [];
  ((b.org && b.org.depts) || []).forEach(function(d){
    var tasks = DATA.pending.filter(function(t){ return t.category === d.cat; }).sort(function(a,b){ return b.score - a.score; });
    var qs = (b.questions || []).filter(function(q){ return q.cat === d.cat; });
    var stale = tasks.filter(function(t){ return now - new Date(t.recorded) > STALE_DAYS*86400000; });
    var mine = events.filter(function(e){ return eventCat(e) === d.cat; });
    var todayEv = mine.filter(function(e){ return e.date === today && e.kind !== 'duty'; });
    var soon = mine.filter(function(e){ return (e.kind === 'deadline' || e.kind === 'event') && e.date >= today && e.date <= soonEnd; });
    var products = (b.pipeline || []).map(function(p){ return activeStage(p, b.stages || []); }).filter(function(a){ return a && a.cat === d.cat; });
    var state = stale.length ? 'stale' : qs.length ? 'decision' : (tasks.length || products.length) ? 'working' : 'idle';
    out[d.cat] = {dept:d, tasks:tasks, qs:qs, stale:stale, state:state, today:todayEv, soon:soon, products:products,
      prio: tasks.some(function(t){ return t.label === '優先' || t.label === '最優先'; })};
  });
  return out;
}

/* ---------- 読み込み ---------- */
async function load(){
  KEY = location.hash.slice(1);
  if (!KEY) return fail('鍵付きのURL（末尾に # から始まる文字列があるもの）で開いてください。');
  try {
    cryptoKey = await crypto.subtle.importKey('raw', fromB64(KEY), 'AES-GCM', false, ['encrypt','decrypt']);
    var res = await fetch('data.enc.json?t=' + Date.now(), {cache:'no-store'});
    DATA = await decryptJSON(await res.json());
  } catch(e) {
    return fail('鍵が正しくないか、データを読み込めませんでした。URLの末尾まで正しくコピーされているか確認してください。');
  }
  try {
    var pipe = await readWeb('pipeline.enc.json');
    if (pipe && pipe.pipeline) { DATA.board.pipeline = pipe.pipeline; DATA.pipeSyncPending = true; }
    var ev = await readWeb('events.enc.json');
    if (ev && ev.events) DATA.board.events = ev.events;
    var to = await readWeb('taskops.enc.json');
    DATA.webOps = (to && to.ops) || [];
  } catch(e) { DATA.webOps = DATA.webOps || []; }
  DATA.pending = mergeOps(DATA.pending, (DATA.pendingOps || []).concat(DATA.webOps || []));
  if (!document.getElementById('shell')) shell();
  renderHeader(); renderBoard(); Office.update();
  if (!Memo.loaded) Memo.load();
}

      labelsEl.appendChild(lbl);
      desks[d.cat] = {dept:d, group:g, w:wk, d:dk, ring:ring, hand:hand, alert:alert, beam:beam, spot:spot, sweat:sweat, label:lbl, phase:i*1.7, idx:i};
      // 秘書から各席への線
    });

    // 秘書
    var sg = new THREE.Group(); sg.position.set(0,0,4.2); scene.add(sg);
    var sw = makeWorker(3, {shirt:0x2E4C88, headset:true}), sd = makeDesk(3.2, {mug:0xC9431A});
    sg.add(sw.group); sg.add(sd.group);
    var srug = new THREE.Mesh(new THREE.CircleGeometry(2.6,40), mat(0x2E4C88, {roughness:1, transparent:true, opacity:.25})); srug.rotation.x = -Math.PI/2; srug.position.set(0,.015,.4); sg.add(srug);
    sg.traverse(function(o){ o.userData.dept = '__secretary'; });
    var slbl = document.createElement('div'); slbl.className = 'nm'; slbl.innerHTML = '秘書'; slbl.onclick = function(){ select('__secretary', true); }; labelsEl.appendChild(slbl);
    bubbleEl = document.createElement('div'); bubbleEl.className = 'bubble'; labelsEl.appendChild(bubbleEl);
    secretary = {group:sg, w:sw, d:sd, label:slbl, phase:0};

    // 秘書→各席の連絡線（組織図）
    Object.keys(desks).forEach(function(k){
      var t = desks[k].group.position;
      var pts = [new THREE.Vector3(0,.03,4.2), new THREE.Vector3(t.x,.03,t.z+1.6)];
      var line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({color:cssColor('--accent'), dashSize:.3, gapSize:.2, transparent:true, opacity:.55}));
      line.computeLineDistances(); scene.add(line); desks[k].line = line;
    });

    bindInput();
    window.addEventListener('resize', resize);
    resize();
  }

  function defaultR(){ var r = canvas.getBoundingClientRect(); return Math.min(42, Math.max(20, 24 / Math.max(.4, r.width / r.height))); }

  function resize(){
    if (!renderer) return;
    var r = canvas.parentElement.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
    cam.r = defaultR();
    var portrait = r.width / r.height < 1; cam.el = portrait ? 1.0 : .62; if (portrait) cam.r *= .85;
  }

  /* ---- 入力 ---- */
  function bindInput(){
    var down = null;
    canvas.addEventListener('pointerdown', function(e){ down = {x:e.clientX, y:e.clientY, az:cam.az, el:cam.el, moved:false}; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', function(e){
      if (!down) return;
      var dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) { down.moved = true; autoSpin = false; canvas.classList.add('drag'); }
      cam.az = down.az - dx * .006; cam.el = Math.max(.25, Math.min(1.25, down.el + dy * .004)); camGoal = null;
    });
    canvas.addEventListener('pointerup', function(e){
      canvas.classList.remove('drag');
      if (down && !down.moved) pick(e);
      down = null;
    });
    root.querySelectorAll('.zoom button').forEach(function(b){
      b.onclick = function(){
        var z = b.dataset.z;
        if (z === 'all') { var rr = canvas.getBoundingClientRect(), pt = rr.width / rr.height < 1; cam.el = pt ? 1.0 : .62; camGoal = {tx:0, tz:-.5, r:defaultR() * (pt ? .85 : 1)}; autoSpin = true; select(null); return; }
        camGoal = {tx:cam.tx, tz:cam.tz, r: Math.max(8, Math.min(44, cam.r * (z === 'in' ? .8 : 1.25)))};
      };
    });
    canvas.addEventListener('wheel', function(e){ e.preventDefault(); cam.r = Math.max(8, Math.min(40, cam.r * (1 + Math.sign(e.deltaY) * .08))); camGoal = null; }, {passive:false});
  }

  function pick(e){
    var r = canvas.getBoundingClientRect();
    var v = new THREE.Vector2(((e.clientX - r.left)/r.width)*2-1, -((e.clientY - r.top)/r.height)*2+1);
    raycaster.setFromCamera(v, camera);
    var hits = raycaster.intersectObjects(scene.children, true);
    for (var i=0;i<hits.length;i++){ var dp = hits[i].object.userData.dept; if (dp) return select(dp, true); }
    select(null);
  }

  function flyTo(cat){
    var p = cat === '__secretary' ? secretary.group.position : desks[cat].group.position;
    camGoal = {tx:p.x, tz:p.z, r: Math.min(cam.r, 13)}; autoSpin = false;
  }

  /* ---- 詳細パネル ---- */
  function select(cat, fly){
    selected = cat;
    Object.keys(desks).forEach(function(k){ desks[k].label.classList.toggle('sel', k === cat); });
    if (secretary) secretary.label.classList.toggle('sel', cat === '__secretary');
    if (!cat) { panelEl.hidden = true; return; }
    if (fly) flyTo(cat);
    var html = '<button class="x" aria-label="閉じる">×</button>';
    if (cat === '__secretary') {
      var org = DATA.board.org.head, sum = summary();
      html += '<h3>'+esc(org.name)+'</h3><span class="state working">全体把握</span><p style="margin:0;font-size:.88rem">'+esc(org.role)+'</p>' +
        '<div class="lbl">今日・明日の予定</div><ul>'+scheduleLines().map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ul>' +
        '<div class="lbl">報告</div><ul>'+sum.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ul>' +
        '<div class="lbl">道具</div><div class="tools">'+org.tools.map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('')+'</div>';
    } else {
      var s = states[cat], d = s.dept;
      html += '<h3>'+esc(d.cat)+'担当</h3><span class="state '+s.state+'">'+STATE_JP[s.state]+'</span>' +
        '<div class="meta mono">Works/'+esc(d.folder)+'/</div>';
      if (s.today.length) html += '<div class="lbl">今日の予定</div><ul>'+s.today.map(function(e){ return '<li><b>'+(e.time ? esc(e.time)+' ' : '')+esc(e.title)+'</b></li>'; }).join('')+'</ul>';
      var soonOther = s.soon.filter(function(e){ return s.today.indexOf(e) < 0; });
      if (soonOther.length) html += '<div class="lbl">近い締切</div><ul>'+soonOther.map(function(e){ return '<li>'+jpDate(e.date+'T00:00:00')+' '+esc(e.title)+'</li>'; }).join('')+'</ul>';
      if (s.qs.length) html += '<div class="lbl">あなたへの確認（挙手中）</div>' + s.qs.map(function(q){ return '<div class="qbox">'+esc(q.text)+'</div>'; }).join('');
      if (s.products.length) { var PJ = {hot:'今週やる', now:'次の作業', wait:'待ち'}; html += '<div class="lbl">担当している品番</div><ul>'+s.products.map(function(a){ return '<li><span class="code">'+esc(a.code)+'</span> '+esc(a.name)+' <span class="meta">（'+esc(a.stage)+'・'+PJ[a.state]+'）</span></li>'; }).join('')+'</ul>'; }
      html += '<div class="lbl">担当タスク '+s.tasks.length+'件</div>';
      html += s.tasks.length ? '<ul>'+s.tasks.map(function(t){
        var old = s.stale.indexOf(t) >= 0;
        return '<li class="task"><span class="tag '+esc(t.label)+'">'+esc(t.label)+'</span><span>'+esc(t.content)+'</span><span class="meta mono">記録 '+jpDate(t.recorded)+(old?' ・ 30日以上止まっています':'')+'</span></li>';
      }).join('')+'</ul>' : '<p class="muted" style="margin:0;font-size:.86rem">いまは手が空いています。</p>';
      html += '<div class="lbl">道具（AI・ツール）</div><div class="tools">'+d.tools.map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('')+'</div>';
    }
    panelEl.innerHTML = html; panelEl.hidden = false;
    panelEl.querySelector('.x').onclick = function(){ select(null); };
  }

  function summary(){
    var c = count(), out = [];
    out.push('未完了は '+DATA.pending.length+' 件です。');
    if (c.stale) out.push('30日以上止まっている担当が '+c.stale+' 名います（赤く点滅）。');
    if (c.decision) out.push('あなたの返事を待って手を挙げている担当が '+c.decision+' 名います。');
    var n = nextEvent(); if (n) { var dd = Math.ceil((n.at - new Date())/86400000); out.push(n.title+'まで あと'+dd+'日です。'); }
    var top = DATA.pending.slice().sort(function(a,b){ return b.score - a.score; })[0];
    if (top) out.push('いちばん優先度が高いのは「'+top.content.slice(0,40)+(top.content.length>40?'…':'')+'」です。');
    return out;
  }

  function count(){
    var c = {stale:0, decision:0, working:0, idle:0, today:0};
    Object.keys(states).forEach(function(k){ c[states[k].state]++; if (states[k].today.length) c.today++; if (states[k].state === 'stale' && states[k].qs.length) c.decision++; });
    return c;
  }

  /* ---- 状態を反映（データ更新ごと） ---- */
  function update(){
    if (!DATA) return;
    states = deptStates();
    if (!built) return;
    var accent = cssColor('--accent'), warn = cssColor('--warn'), urgent = cssColor('--urgent'), idle = cssColor('--idle');
    Object.keys(desks).forEach(function(k){
      var dk = desks[k], s = states[k];
      dk.state = s.state; dk.hasQ = s.qs.length > 0; dk.isStale = s.stale.length > 0; dk.today = s.today.length > 0; dk.soon = s.soon.length > 0;
      dk.ring.material.color.copy(s.state === 'stale' ? urgent : s.state === 'decision' ? warn : dk.today ? new THREE.Color(0xE8A800) : s.state === 'working' ? accent : idle);
      dk.d.lidMat.emissive.copy(s.tasks.length ? accent : new THREE.Color(0)); dk.d.lidMat.emissiveIntensity = s.tasks.length ? .6 : 0;
      dk.d.paper.visible = s.tasks.length > 0 || s.products.length > 0;
      dk.line.material.opacity = s.tasks.length ? .6 : .15;
      dk.label.className = 'nm ' + s.state + (dk.today ? ' today' : '') + (selected === k ? ' sel' : '');
      dk.label.innerHTML = (dk.today ? '<span class="b now">今日</span>' : '') + esc(k) + (s.tasks.length ? '<span class="b">'+s.tasks.length+'</span>' : '');
    });
    var duty = isDutyDay(dayKey(0));
    hemi.intensity = duty ? .38 : .75; sun.intensity = duty ? .3 : .75;
    var c = count();
    hudEl.innerHTML =
      chip('today','今日の予定',c.today) + chip('stale','放置',c.stale) + chip('decision','確認待ち',c.decision) + chip('working','作業中',c.working) +
      '<button class="chip" data-s="__secretary">秘書の報告</button>';
    hudEl.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        var s = b.dataset.s;
        if (s === '__secretary') return select('__secretary', true);
        var list = Object.keys(states).filter(function(k){ return s === 'decision' ? states[k].qs.length : s === 'today' ? states[k].today.length : states[k].state === s; });
        if (!list.length) return;
        hudCycle[s] = ((hudCycle[s] == null ? -1 : hudCycle[s]) + 1) % list.length;
        select(list[hudCycle[s]], true);
      };
    });
    if (selected) select(selected, false);
  }
  function chip(s, l, n){ return '<button class="chip '+s+'" data-s="'+s+'"'+(n?'':' disabled')+'>'+l+' <span class="mono">'+n+'</span></button>'; }

  /* ---- アニメーション ---- */
  function scheduleLines(){
    var out = [], labels = ['今日', '明日'];
    [0,1].forEach(function(off){
      var key = dayKey(off), evs = eventsOn(key);
      if (isDutyDay(key)) out.push(labels[off]+'は担当業務の日です。');
      var work = evs.filter(function(e){ return e.kind !== 'duty'; }).sort(function(a,b){ return (a.time||'99').localeCompare(b.time||'99'); });
      if (work.length) out.push(labels[off]+'は '+work.map(function(e){ return (e.time ? e.time+' ' : '')+e.title; }).join(' → ')+' です。');
      else if (!off && !isDutyDay(key)) out.push('今日は決まった予定がありません。優先度の高いタスクから進めましょう。');
    });
    return out;
  }

  function bubbleLines(){
    var lines = scheduleLines().concat(summary().slice(1));
    Object.keys(states).forEach(function(k){ if (states[k].qs.length) lines.push(k+'担当が確認を待っています。'); });
    lines.push('タスクは「秘書に共有して」で受け付けます。');
    return lines;
  }

  function spawnPlane(){
    var busy = Object.keys(desks).filter(function(k){ return states[k] && states[k].tasks.length; });
    if (!busy.length) return;
    var k = busy[Math.floor(Math.random()*busy.length)], to = desks[k].group.position;
    var m = new THREE.Mesh(new THREE.ConeGeometry(.16,.42,3), new THREE.MeshStandardMaterial({color:0xFFFFFF, emissive:0xFFFFFF, emissiveIntensity:.25}));
    m.castShadow = true; scene.add(m);
    planes.push({m:m, from:new THREE.Vector3(0,1.6,4.6), to:new THREE.Vector3(to.x,1.3,to.z+.8), t:0, dur:2.2 + Math.random()*.8});
  }

  var tmpV = new THREE.Vector3();
  function project(obj, y){
    tmpV.set(0,y,0); obj.localToWorld(tmpV); tmpV.project(camera);
    var r = canvas.getBoundingClientRect();
    return {x:(tmpV.x*.5+.5)*r.width, y:(-tmpV.y*.5+.5)*r.height, vis: tmpV.z < 1};
  }

  function frame(){
    if (!running) return;
    raf = requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, mo = REDUCED ? 0 : 1;

    // カメラ
    if (autoSpin && mo) cam.az = Math.sin(t*.08) * .35;
    if (camGoal) {
      cam.tx += (camGoal.tx - cam.tx) * .06; cam.tz += (camGoal.tz - cam.tz) * .06; cam.r += (camGoal.r - cam.r) * .06;
      if (Math.abs(camGoal.tx - cam.tx) < .01 && Math.abs(camGoal.r - cam.r) < .01) camGoal = null;
    }
    camera.position.set(cam.tx + cam.r*Math.sin(cam.az)*Math.cos(cam.el), cam.r*Math.sin(cam.el), cam.tz + cam.r*Math.cos(cam.az)*Math.cos(cam.el));
    camera.lookAt(cam.tx, .8, cam.tz);

    // 社員
    Object.keys(desks).forEach(function(k){
      var dk = desks[k], w = dk.w, p = t + dk.phase, st = dk.state;
      var L = w.arms[0], R = w.arms[1];
      if (st === 'idle') {
        w.torso.rotation.x = -.12; w.head.rotation.y = Math.sin(p*.5)*.5*mo; w.head.rotation.x = -.1;
        L.rotation.x = -.15; R.rotation.x = -.15 - (Math.sin(p*.4) > .85 ? 1.6 : 0)*mo; // ときどきコーヒー
        L.rotation.z = R.rotation.z = 0;
      } else {
        var speed = dk.today ? 17 : dk.soon ? 13 : 5;
        w.torso.rotation.x = (dk.today ? .16 : .08) + Math.sin(p*2)*.01*mo; w.head.rotation.x = .18 + Math.sin(p*3)*.03*mo; w.head.rotation.y = dk.soon ? Math.sin(p*9)*.12*mo : 0;
        L.rotation.x = -1.15 + Math.sin(p*speed)*.12*mo;
        R.rotation.x = -1.15 + Math.sin(p*speed + 1.6)*.12*mo;
        L.rotation.z = -.15; R.rotation.z = .15;
      }
      if (dk.hasQ) { // 挙手（右手を上げて振る）
        R.rotation.x = -2.85; R.rotation.z = .25 + Math.sin(p*5)*.18*mo;
        w.head.rotation.y = Math.sin(p*1.3)*.25*mo; w.head.rotation.x = -.15;
      }
      dk.hand.visible = dk.hasQ; dk.hand.position.y = 2.55 + Math.sin(p*4)*.06*mo;
      dk.beam.visible = dk.spot.visible = !!dk.today; dk.beam.material.opacity = .16 + Math.sin(t*2 + dk.phase)*.05*mo;
      dk.sweat.visible = !!dk.soon; if (dk.soon) { var sw = (t*.7 + dk.phase) % 1; dk.sweat.position.y = 1.95 - sw*.35*mo; dk.sweat.material.opacity = 1 - sw*.8*mo; }
      dk.alert.visible = dk.isStale; dk.alert.material.opacity = mo ? (Math.sin(t*7) > 0 ? 1 : .25) : 1;
      if (st === 'stale') { var on = mo ? (Math.sin(t*7) > 0) : true; w.shirtMat.emissive.setHex(on ? 0x8A1A00 : 0); dk.ring.material.opacity = on ? .85 : .25; }
      else { w.shirtMat.emissive.setHex(0); dk.ring.material.opacity = .5; }
      var lp = project(dk.group, 3.05);
      dk.label.style.left = lp.x+'px'; dk.label.style.top = lp.y+'px'; dk.label.style.display = lp.vis ? '' : 'none';
    });

    // 秘書（電話しながら書類を配る）
    var s = secretary.w;
    s.head.rotation.y = Math.sin(t*.7)*.35*mo; s.torso.rotation.x = .02;
    s.arms[0].rotation.x = -1.1 + Math.sin(t*12)*.1*mo; s.arms[0].rotation.z = -.15;
    s.arms[1].rotation.x = -1.6 + Math.sin(t*1.5)*.5*mo; s.arms[1].rotation.z = .1;
    var sp = project(secretary.group, 2.6);
    secretary.label.style.left = sp.x+'px'; secretary.label.style.top = sp.y+'px';
    bubbleT -= dt;
    if (bubbleT <= 0) { var lines = bubbleLines(); bubbleEl.textContent = lines[bubbleIdx++ % lines.length]; bubbleT = 5; }
    var bp = project(secretary.group, 3.3);
    bubbleEl.style.left = bp.x+'px'; bubbleEl.style.top = bp.y+'px';

    // 書類が飛ぶ
    if (mo) { planeT -= dt; if (planeT <= 0) { spawnPlane(); planeT = 1.4 + Math.random(); } }
    for (var i = planes.length-1; i >= 0; i--) {
      var pl = planes[i]; pl.t += dt / pl.dur;
      if (pl.t >= 1) { scene.remove(pl.m); pl.m.geometry.dispose(); planes.splice(i,1); continue; }
      var pos = pl.from.clone().lerp(pl.to, pl.t); pos.y += Math.sin(pl.t*Math.PI) * 2.2;
      var ahead = pl.from.clone().lerp(pl.to, Math.min(1, pl.t+.02)); ahead.y += Math.sin(Math.min(1,pl.t+.02)*Math.PI) * 2.2;
      pl.m.position.copy(pos); pl.m.lookAt(ahead); pl.m.rotateX(Math.PI/2);
    }

    renderer.render(scene, camera);
  }

  function start(){
    if (!window.THREE) { root.querySelector('.office').innerHTML = '<p class="msg">3D表示のライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。</p>'; return; }
    if (!built && DATA) { build(); update(); }
    if (running) return;
    running = true; clock.getDelta(); resize(); frame();
  }
  function stop(){ running = false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); else if (tab === 'office') start(); });

  return {mount:mount, start:start, stop:stop, update:update};
})();

/* =====================================================================
   新商品の進み具合を Web で変更（pipeline.enc.json に保存 → 秘書が取り込む）
   ===================================================================== */
var Pipe = (function(){
  var OPTS = [['done','完了'],['hot','今週やる'],['now','次の作業'],['wait','待ち'],['','未着手／不明']];
  var target = null, busy = false;
  function status(t, err){ var el = document.getElementById('pipe-status'); if (el) { el.textContent = t; el.classList.toggle('err', !!err); } }
  function bind(){
    var menu = document.getElementById('dotmenu');
    document.querySelectorAll('.dotbtn').forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        if (!ghToken()) { status('変更するには、メモタブで書き込みの設定（トークン登録）をしてください。', true); return; }
        target = {code: b.dataset.code, j: +b.dataset.j};
        var item = DATA.board.pipeline.filter(function(x){ return x.code === target.code; })[0], cur = (item.s[target.j] || '');
        menu.innerHTML = '<div class="dm-h">'+esc(target.code)+' ・ '+esc(DATA.board.stages[target.j])+'</div>' + OPTS.map(function(o){
          return '<button role="menuitem" data-v="'+o[0]+'"'+(o[0] === cur ? ' aria-current="true"' : '')+'><i class="dot '+o[0]+'"></i>'+o[1]+'</button>';
        }).join('');
        var r = b.getBoundingClientRect();
        menu.style.left = Math.min(window.innerWidth - 190, r.left + window.scrollX - 60) + 'px';
        menu.style.top = (r.bottom + window.scrollY + 6) + 'px';
        menu.hidden = false;
        menu.querySelectorAll('button').forEach(function(mb){ mb.onclick = function(){ menu.hidden = true; save(target.code, target.j, mb.dataset.v); }; });
        menu.querySelector('button').focus();
      };
    });
  }
  document.addEventListener('click', function(e){ var m = document.getElementById('dotmenu'); if (m && !m.hidden && !m.contains(e.target)) m.hidden = true; });
  document.addEventListener('keydown', function(e){ var m = document.getElementById('dotmenu'); if (e.key === 'Escape' && m) m.hidden = true; });

  async function save(code, j, v){
    if (busy) return; busy = true; status('保存中…');
    try {
      for (var attempt = 0; attempt < 2; attempt++) {
        var cur = await ghRead('pipeline.enc.json');
        var base = JSON.parse(JSON.stringify((cur.data && cur.data.pipeline) || DATA.board.pipeline));
        base.forEach(function(x){ if (x.code === code) { x.s = x.s.slice(); x.s[j] = v; } });
        var body = {message:'update pipeline', content: btoa(await encryptJSON({pipeline: base, updated: new Date().toISOString()}))};
        if (cur.sha) body.sha = cur.sha;
        var put = await ghFile('pipeline.enc.json', 'PUT', body);
        if (put.ok) {
          DATA.board.pipeline = base; DATA.pipeSyncPending = true;
          renderBoard(); Office.update();
          status('保存しました。オフィスに反映済み。秘書が取り込むと、タスクの担当工程にも反映されます。');
          return;
        }
        if (put.status !== 409 && put.status !== 422) throw new Error('保存できませんでした（'+put.status+'）。');
      }
      throw new Error('ほかの端末と同時に保存されました。もう一度選んでください。');
    } catch(e) { status(e.message, true); }
    finally { busy = false; }
  }
  return {bind: bind};
})();

/* =====================================================================
   メモ（暗号化して GitHub に保存）
   ===================================================================== */
var Memo = (function(){
  var root, memos = [], sha = null, editing = null, query = '', confirmDel = null, busy = false;
  var TOKEN_KEY = 'wb_token', DRAFT_KEY = 'wb_draft';
  var CATS = ['商品提案','業務効率化','アプリ開発','撮影','製作・編集','その他'], selCats = [], filterCat = '', view = ls('wb_memo_view') || 'date';
  function token(){ return ls(TOKEN_KEY); }

  function mount(el){ root = el; draw(); }

  async function load(){
    Memo.loaded = true;
    try {
      if (token()) {
        var r = await gh('GET');
        if (r.status === 404) { memos = []; sha = null; }
        else if (r.ok) { var j = await r.json(); sha = j.sha; memos = (await decryptJSON(JSON.parse(atob(j.content.replace(/\n/g,''))))).memos || []; }
        else throw new Error(r.status === 401 ? 'トークンが無効です。設定し直してください。' : 'GitHub から読み込めませんでした（'+r.status+'）。');
      } else {
        var p = await fetch('memos.enc.json?t=' + Date.now(), {cache:'no-store'});
        memos = p.ok ? ((await decryptJSON(await p.json())).memos || []) : [];
      }
      setStatus('');
    } catch(e) { setStatus(e.message || '読み込みに失敗しました。', true); }
    draw();
  }

  function gh(method, body){
    return fetch('https://api.github.com/repos/'+REPO+'/contents/memos.enc.json', {
      method: method, cache:'no-store',
      headers: {'Authorization':'Bearer '+token(), 'Accept':'application/vnd.github+json'},
      body: body ? JSON.stringify(body) : undefined
    });
  }

  // 最新を取り直してから変更を当てて保存（別端末の変更を消さない）
  async function save(mutate, msg){
    if (busy) return; busy = true; setStatus('保存中…');
    try {
      for (var attempt = 0; attempt < 2; attempt++) {
        var r = await gh('GET'), cur = [];
        if (r.ok) { var j = await r.json(); sha = j.sha; cur = (await decryptJSON(JSON.parse(atob(j.content.replace(/\n/g,''))))).memos || []; }
        else if (r.status === 404) sha = null;
        else throw new Error(r.status === 401 ? 'トークンが無効です。設定し直してください。' : '保存できませんでした（'+r.status+'）。');
        cur = mutate(cur);
        var put = await gh('PUT', Object.assign({message: msg, content: btoa(await encryptJSON({memos: cur}))}, sha ? {sha: sha} : {}));
        if (put.ok) { sha = (await put.json()).content.sha; memos = cur; setStatus('保存しました'); draw(); return true; }
        if (put.status !== 409 && put.status !== 422) throw new Error('保存できませんでした（'+put.status+'）。');
      }
      throw new Error('ほかの端末と同時に保存されました。もう一度押してください。');
    } catch(e) { setStatus(e.message, true); return false; }
    finally { busy = false; }
  }

  function setStatus(t, err){ var s = root && root.querySelector('#memo-status'); if (s) { s.textContent = t; s.className = 'status' + (err ? ' err' : ''); } }

  function catsOf(m){ return (m.cats && m.cats.length) ? m.cats : ['その他']; }
  function memoCard(m, tk){
    return '<div class="memo'+(m.pinned?' pinned':'')+'"><div class="mcats">'+catsOf(m).map(function(c){ return '<span>'+esc(c)+'</span>'; }).join('')+'</div><div class="body">'+esc(m.text)+'</div><div class="foot"><span class="mono">'+(m.pinned?'📌 ':'')+jpDateTime(m.updated)+'</span>' +
      (tk ? '<span class="acts"><button data-a="pin" data-id="'+m.id+'">'+(m.pinned?'ピンを外す':'ピン留め')+'</button><button data-a="edit" data-id="'+m.id+'">編集</button>' +
        (confirmDel === m.id ? '<button class="really" data-a="del" data-id="'+m.id+'">本当に削除</button><button data-a="nodel">やめる</button>' : '<button data-a="ask" data-id="'+m.id+'">削除</button>') + '</span>' : '') +
      '</div></div>';
  }

  function draw(){
    if (!root) return;
    var tk = token();
    var byDate = function(a,b){ return (b.pinned?1:0) - (a.pinned?1:0) || b.updated.localeCompare(a.updated); };
    var hit = memos.filter(function(m){ return !query || m.text.toLowerCase().indexOf(query.toLowerCase()) >= 0; });
    var list = hit.filter(function(m){ return !filterCat || catsOf(m).indexOf(filterCat) >= 0; }).sort(byDate);
    var listHtml;
    if (!list.length) listHtml = '<p class="muted" style="margin:0">'+(query || filterCat ? '見つかりません' : 'まだメモはありません')+'</p>';
    else if (view === 'cat') {
      listHtml = CATS.filter(function(c){ return !filterCat || c === filterCat; }).map(function(c){
        var g = list.filter(function(m){ return catsOf(m).indexOf(c) >= 0; });
        return g.length ? '<div class="mgroup"><h3>'+esc(c)+' <span class="mono">'+g.length+'</span></h3>'+g.map(function(m){ return memoCard(m, tk); }).join('')+'</div>' : '';
      }).join('');
    } else listHtml = list.map(function(m){ return memoCard(m, tk); }).join('');

    var draft = editing ? null : (ls(DRAFT_KEY) || '');
    root.innerHTML =
      '<h2>メモ <small>分類して保存・暗号化・Obsidian の _brain/memos.md にも取り込まれます</small></h2>' +
      '<div class="memo-grid"><div class="sec">' +
        (tk ? '' :
        '<div class="setup"><b>この端末で書き込むには、最初に1回だけ設定が必要です</b>' +
          '<ol><li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub のトークン作成画面</a>を開く</li>' +
          '<li>Repository access →「Only select repositories」→ <span class="mono">work-board</span></li>' +
          '<li>Permissions → Contents を「Read and write」にして作成</li>' +
          '<li>表示されたトークンを下に貼って「登録」</li></ol>' +
          '<div class="row"><input type="password" id="memo-token" placeholder="github_pat_..." autocomplete="off" style="flex:1;min-width:180px"><button class="btn primary" id="memo-token-save">登録</button></div>' +
          '<span class="meta">トークンはこの端末のブラウザにだけ保存されます。</span></div>') +
        '<div class="compose"><label for="memo-input" class="lbl" style="font-size:.8rem;font-weight:700">'+(editing ? 'メモを編集' : '新しいメモ')+'</label>' +
          '<textarea id="memo-input" placeholder="思いついたこと、電話の内容、あとで調べること…">'+esc(editing ? (memos.find(function(m){ return m.id === editing; })||{}).text : draft)+'</textarea>' +
          '<fieldset class="catpick"><legend>分類（複数選べます）</legend>' + CATS.map(function(c, i){
            return '<label><input type="checkbox" id="memo-cat-'+i+'" value="'+esc(c)+'"'+(selCats.indexOf(c) >= 0 ? ' checked' : '')+'> '+esc(c)+'</label>';
          }).join('') + '</fieldset>' +
          '<div class="row"><button class="btn primary" id="memo-save"'+(tk?'':' disabled')+'>'+(editing ? '更新' : '保存')+'</button>' +
          (editing ? '<button class="btn" id="memo-cancel">やめる</button>' : '') +
          '<span id="memo-status" class="status"></span></div></div>' +
        (tk ? '<div class="row meta">書き込み：設定済み <button class="btn" id="memo-token-clear" style="padding:2px 10px;font-size:.75rem">この端末の設定を解除</button></div>' : '') +
      '</div><div class="sec">' +
        '<input type="search" id="memo-q" placeholder="メモを検索" value="'+esc(query)+'">' +
        '<div class="mfilter"><button data-c=""'+(filterCat ? '' : ' aria-pressed="true"')+'>すべて <span class="mono">'+hit.length+'</span></button>' +
          CATS.map(function(c){ var n = hit.filter(function(m){ return catsOf(m).indexOf(c) >= 0; }).length;
            return '<button data-c="'+esc(c)+'"'+(filterCat === c ? ' aria-pressed="true"' : '')+'>'+esc(c)+' <span class="mono">'+n+'</span></button>'; }).join('') + '</div>' +
        '<div class="row meta">並び順 <span class="seg"><button data-v="date"'+(view==='date'?' aria-pressed="true"':'')+'>新しい順</button><button data-v="cat"'+(view==='cat'?' aria-pressed="true"':'')+'>分類ごと</button></span></div>' +
        '<div class="memos">' + listHtml + '</div>' +
      '</div></div>';

    var ta = root.querySelector('#memo-input');
    ta.oninput = function(){ if (!editing) ls(DRAFT_KEY, ta.value); };
    root.querySelectorAll('.catpick input').forEach(function(cb){
      cb.onchange = function(){ selCats = Array.prototype.filter.call(root.querySelectorAll('.catpick input'), function(x){ return x.checked; }).map(function(x){ return x.value; }); };
    });
    root.querySelectorAll('.mfilter button').forEach(function(b){ b.onclick = function(){ filterCat = b.dataset.c; draw(); }; });
    root.querySelectorAll('.seg button').forEach(function(b){ b.onclick = function(){ view = b.dataset.v; ls('wb_memo_view', view); draw(); }; });
    var q = root.querySelector('#memo-q');
    q.oninput = function(){ query = q.value; var pos = q.selectionStart; draw(); var n = root.querySelector('#memo-q'); n.focus(); n.setSelectionRange(pos,pos); };
    var ts = root.querySelector('#memo-token-save');
    if (ts) ts.onclick = function(){ var v = root.querySelector('#memo-token').value.trim(); if (!v) return; ls(TOKEN_KEY, v); load(); };
    var tc = root.querySelector('#memo-token-clear');
    if (tc) tc.onclick = function(){ ls(TOKEN_KEY, null); draw(); };
    var cancel = root.querySelector('#memo-cancel');
    if (cancel) cancel.onclick = function(){ editing = null; selCats = []; draw(); };
    root.querySelector('#memo-save').onclick = async function(){
      var text = ta.value.trim(); if (!text) { setStatus('メモを入力してください', true); return; }
      var cats = selCats.length ? selCats.slice() : ['その他'];
      var now = new Date().toISOString(), id = editing;
      var ok = await save(function(cur){
        if (id) return cur.map(function(m){ return m.id === id ? Object.assign({}, m, {text:text, cats:cats, updated:now}) : m; });
        return cur.concat([{id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text:text, cats:cats, created:now, updated:now, pinned:false}]);
      }, id ? 'edit memo' : 'add memo');
      if (ok) { if (!id) ls(DRAFT_KEY, null); editing = null; selCats = []; draw(); setStatus('保存しました'); }
    };
    root.querySelectorAll('.acts button').forEach(function(b){
      b.onclick = async function(){
        var id = b.dataset.id, a = b.dataset.a;
        if (a === 'edit') { editing = id; var m = memos.find(function(x){ return x.id === id; }); selCats = (m && m.cats) ? m.cats.slice() : []; draw(); root.querySelector('#memo-input').focus(); }
        else if (a === 'ask') { confirmDel = id; draw(); }
        else if (a === 'nodel') { confirmDel = null; draw(); }
        else if (a === 'del') { confirmDel = null; await save(function(cur){ return cur.filter(function(m){ return m.id !== id; }); }, 'delete memo'); }
        else if (a === 'pin') { await save(function(cur){ return cur.map(function(m){ return m.id === id ? Object.assign({}, m, {pinned: !m.pinned}) : m; }); }, 'pin memo'); }
      };
    });
  }

  return {mount:mount, load:load, loaded:false};
})();

load();
setInterval(function(){ if (!document.hidden) load(); }, 300000);
window.addEventListener('hashchange', function(){ location.reload(); });
})();
</script>
</body>
</html>
