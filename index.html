          '<div class="row2"><select class="bk-who">'+names.map(function(n){ return '<option'+(n === it.who ? ' selected' : '')+'>'+esc(n)+'</option>'; }).join('')+'</select>' +
          '<select class="bk-label">'+LABELS.map(function(l){ return '<option'+(l === it.label ? ' selected' : '')+'>'+l+'</option>'; }).join('')+'</select></div>' +
          '<div class="meta">予定：'+esc(it.win.label)+' → '+dlist(it.days)+(it.deadline ? ' ／ 締切 '+jpDate(it.deadline+'T00:00:00') : '')+'</div></div>';
      }).join('') + '</div>' +
      '<div class="row"><button class="btn primary" id="bk-save">'+(items.every(function(x){ return x.mode === 'skip'; }) ? '閉じる' : '登録する')+'</button><button class="btn" data-close>やめる</button></div><span class="status"></span>',
      function(sh){
        sh.querySelectorAll('.bk-mode').forEach(function(g){
          g.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ collect(sh); items[+g.dataset.m].mode = b.dataset.v; preview(); }; });
        });
        sh.querySelectorAll('[data-x]').forEach(function(b){ b.onclick = function(){ collect(sh); items.splice(+b.dataset.x, 1); if (items.length) preview(); else Sheet.close(); }; });
        sh.querySelector('#bk-save').onclick = function(){ collect(sh); commit(sh); };
      });
  }
  function collect(sh){
    sh.querySelectorAll('.bk-item').forEach(function(row){
      var it = items[+row.dataset.i]; if (!it) return;
      if (it.off) { it.who = row.querySelector('.bk-who').value; return; }
      if (it.mode !== 'link') it.content = row.querySelector('.bk-content').value.trim() || it.content;
      it.who = row.querySelector('.bk-who').value; it.label = row.querySelector('.bk-label').value;
    });
  }

  async function commit(sh){
    st(sh, '登録中…');
    try {
      var now = new Date().toISOString(), ops = [], evs = [], linked = 0, skipped = 0;
      var use = items.filter(function(it){ if (it.mode === 'skip') { skipped++; return false; } return true; });
      if (!use.length) { Sheet.close(); toast('登録するものはありませんでした'); return; }
      var offs = 0;
      use = use.filter(function(it){
        if (!it.off) return true;
        it.days.forEach(function(d){ var o = {date:d, kind:'off', title:it.title, assignee:it.who}; if (it.half) o.half = true; evs.push(o); });
        offs++; return false;
      });
      use.forEach(function(it){
        if (it.mode === 'link') {
          it.id = it.dup.id; linked++;
          var e = {op:'edit', id:it.id, opId:newId(), at:now};
          if ((it.dup.assignee || '') !== it.who) e.assignee = it.who;
          if (it.dup.label !== it.label) e.label = it.label;
          if (Object.keys(e).length > 4) ops.push(e);
        } else {
          it.id = newId();
          ops.push({op:'add', id:it.id, content:it.content, category:it.category, label:it.label, assignee:it.who, opId:newId(), at:now});
        }
        it.days.forEach(function(d){ var ev = {date:d, kind:'plan', title:it.title, task:it.id, assignee:it.who}; if (it.icon) ev.icon = it.icon; evs.push(ev); });
        if (it.deadline) evs.push({date:it.deadline, kind:'deadline', title:it.title + ' 締切', task:it.id, assignee:it.who});
      });
      // 1) タスク
      if (ops.length) {
        await ghUpdate('taskops.enc.json', function(d){ return {ops: ((d && d.ops) || []).concat(ops)}; }, 'bulk tasks');
        DATA.webOps = (DATA.webOps || []).concat(ops); DATA.pending = mergeOps(DATA.pending, ops);
      }
      // 2) 予定
      var er = await ghUpdate('events.enc.json', function(d){ return {events: JSON.parse(JSON.stringify((d && d.events) || DATA.board.events || [])).concat(evs), updated: now}; }, 'bulk events');
      DATA.board.events = er.events;
      // 3) 新発進捗
      var stages = DATA.board.stages || [];
      var codeItems = use.filter(function(it){ return it.code; });
      if (codeItems.length) {
        await savePipeline(function(base){
          codeItems.forEach(function(it){
            var x = base.filter(function(p){ return p.code === it.code; })[0];
            if (!x) { x = {code:it.code, name:'（商品名を入力）', s: stages.map(function(_, j){ return j < it.stageIdx ? 'done' : ''; }), note:'一括変換で追加'}; base.push(x); }
            if (!x.assignee) x.assignee = it.who;
            if (x.note && /^いったん保留/.test(x.note)) x.note = x.note.replace(/^いったん保留[^。]*。?/, '').trim();  // 動かしたら保留を外す
            if (x.s[it.stageIdx] !== 'done') { x.s = x.s.slice(); x.s[it.stageIdx] = 'hot'; }
          });
        }, 'bulk pipeline');
      }
      ls('wb_bulk', null); items = null;
      Sheet.close(); render(); renderBoard(); Office.update();
      var added = use.length - linked;
      if (offs) { added = added; }
      toast([offs ? '休み ' + offs + '件' : '', added ? '新規 ' + added + '件' : '', linked ? '既存に予定追加 ' + linked + '件' : '', skipped ? '登録しない ' + skipped + '件' : ''].filter(Boolean).join('・') + ' で登録しました');
    } catch(err) { st(sh, err.message, true); }
  }
  return {mount:mount, render:render};
})();

/* =====================================================================
   メモ（暗号化して GitHub に保存）
   ===================================================================== */
var Memo = (function(){
  var root, memos = [], sha = null, editing = null, query = '', confirmDel = null, busy = false;
  var TOKEN_KEY = 'wb_token', DRAFT_KEY = 'wb_draft';
  var CATS = ['商品提案','業務効率化','アプリ開発','撮影','製作・編集','その他'], selCats = [], filterCat = '', view = ls('wb_memo_view') || 'date';
  function token(){ return ls(TOKEN_KEY); }

  function mount(el){ root = el; draw(); }

  async function load(){
    Memo.loaded = true;
    try {
      if (token()) {
        var r = await gh('GET');
        if (r.status === 404) { memos = []; sha = null; }
        else if (r.ok) { var j = await r.json(); sha = j.sha; memos = (await decryptJSON(JSON.parse(atob(j.content.replace(/\n/g,''))))).memos || []; }
        else throw new Error(r.status === 401 ? 'トークンが無効です。設定し直してください。' : 'GitHub から読み込めませんでした（'+r.status+'）。');
      } else {
        var p = await fetch('memos.enc.json?t=' + Date.now(), {cache:'no-store'});
        memos = p.ok ? ((await decryptJSON(await p.json())).memos || []) : [];
      }
      setStatus('');
    } catch(e) { setStatus(e.message || '読み込みに失敗しました。', true); }
    draw();
  }

  function gh(method, body){
    return fetch('https://api.github.com/repos/'+REPO+'/contents/memos.enc.json', {
      method: method, cache:'no-store',
      headers: {'Authorization':'Bearer '+token(), 'Accept':'application/vnd.github+json'},
      body: body ? JSON.stringify(body) : undefined
    });
  }

  // 最新を取り直してから変更を当てて保存（別端末の変更を消さない）
  async function save(mutate, msg){
    if (busy) return; busy = true; setStatus('保存中…');
    try {
      for (var attempt = 0; attempt < 2; attempt++) {
        var r = await gh('GET'), cur = [];
        if (r.ok) { var j = await r.json(); sha = j.sha; cur = (await decryptJSON(JSON.parse(atob(j.content.replace(/\n/g,''))))).memos || []; }
        else if (r.status === 404) sha = null;
        else throw new Error(r.status === 401 ? 'トークンが無効です。設定し直してください。' : '保存できませんでした（'+r.status+'）。');
        cur = mutate(cur);
        var put = await gh('PUT', Object.assign({message: msg, content: btoa(await encryptJSON({memos: cur}))}, sha ? {sha: sha} : {}));
        if (put.ok) { sha = (await put.json()).content.sha; memos = cur; setStatus('保存しました'); draw(); return true; }
        if (put.status !== 409 && put.status !== 422) throw new Error('保存できませんでした（'+put.status+'）。');
      }
      throw new Error('ほかの端末と同時に保存されました。もう一度押してください。');
    } catch(e) { setStatus(e.message, true); return false; }
    finally { busy = false; }
  }

  function setStatus(t, err){ var s = root && root.querySelector('#memo-status'); if (s) { s.textContent = t; s.className = 'status' + (err ? ' err' : ''); } }

  function catsOf(m){ return (m.cats && m.cats.length) ? m.cats : ['その他']; }
  function memoCard(m, tk){
    return '<div class="memo'+(m.pinned?' pinned':'')+'"><div class="mcats">'+catsOf(m).map(function(c){ return '<span>'+esc(c)+'</span>'; }).join('')+'</div><div class="body">'+esc(m.text)+'</div><div class="foot"><span class="mono">'+(m.pinned?'📌 ':'')+jpDateTime(m.updated)+'</span>' +
      (tk ? '<span class="acts"><button data-a="pin" data-id="'+m.id+'">'+(m.pinned?'ピンを外す':'ピン留め')+'</button><button data-a="edit" data-id="'+m.id+'">編集</button>' +
        (confirmDel === m.id ? '<button class="really" data-a="del" data-id="'+m.id+'">本当に削除</button><button data-a="nodel">やめる</button>' : '<button data-a="ask" data-id="'+m.id+'">削除</button>') + '</span>' : '') +
      '</div></div>';
  }

  function draw(){
    if (!root) return;
    var tk = token();
    var byDate = function(a,b){ return (b.pinned?1:0) - (a.pinned?1:0) || b.updated.localeCompare(a.updated); };
    var hit = memos.filter(function(m){ return !query || m.text.toLowerCase().indexOf(query.toLowerCase()) >= 0; });
    var list = hit.filter(function(m){ return !filterCat || catsOf(m).indexOf(filterCat) >= 0; }).sort(byDate);
    var listHtml;
    if (!list.length) listHtml = '<p class="muted" style="margin:0">'+(query || filterCat ? '見つかりません' : 'まだメモはありません')+'</p>';
    else if (view === 'cat') {
      listHtml = CATS.filter(function(c){ return !filterCat || c === filterCat; }).map(function(c){
        var g = list.filter(function(m){ return catsOf(m).indexOf(c) >= 0; });
        return g.length ? '<div class="mgroup"><h3>'+esc(c)+' <span class="mono">'+g.length+'</span></h3>'+g.map(function(m){ return memoCard(m, tk); }).join('')+'</div>' : '';
      }).join('');
    } else listHtml = list.map(function(m){ return memoCard(m, tk); }).join('');

    var draft = editing ? null : (ls(DRAFT_KEY) || '');
    root.innerHTML =
      '<h2>メモ <small>分類して保存・暗号化・Obsidian の _brain/memos.md にも取り込まれます</small></h2>' +
      '<div class="memo-grid"><div class="sec">' +
        (tk ? '' :
        '<div class="setup"><b>この端末で書き込むには、最初に1回だけ設定が必要です</b>' +
          '<ol><li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub のトークン作成画面</a>を開く</li>' +
          '<li>Repository access →「Only select repositories」→ <span class="mono">work-board</span></li>' +
          '<li>Permissions → Contents を「Read and write」にして作成</li>' +
          '<li>表示されたトークンを下に貼って「登録」</li></ol>' +
          '<div class="row"><input type="password" id="memo-token" placeholder="github_pat_..." autocomplete="off" style="flex:1;min-width:180px"><button class="btn primary" id="memo-token-save">登録</button></div>' +
          '<span class="meta">トークンはこの端末のブラウザにだけ保存されます。</span>' +
          (SHARED_PW ? '<div class="row"><button class="btn primary" id="tok-unlock">共有パスワードで有効にする</button><span class="meta">ほかの端末で共有済みならこちら</span></div>' : '') + '</div>') +
        '<div class="compose"><label for="memo-input" class="lbl" style="font-size:.8rem;font-weight:700">'+(editing ? 'メモを編集' : '新しいメモ')+'</label>' +
          '<textarea id="memo-input" placeholder="思いついたこと、電話の内容、あとで調べること…">'+esc(editing ? (memos.find(function(m){ return m.id === editing; })||{}).text : draft)+'</textarea>' +
          '<fieldset class="catpick"><legend>分類（複数選べます）</legend>' + CATS.map(function(c, i){
            return '<label><input type="checkbox" id="memo-cat-'+i+'" value="'+esc(c)+'"'+(selCats.indexOf(c) >= 0 ? ' checked' : '')+'> '+esc(c)+'</label>';
          }).join('') + '</fieldset>' +
          '<div class="row"><button class="btn primary" id="memo-save"'+(tk?'':' disabled')+'>'+(editing ? '更新' : '保存')+'</button>' +
          (editing ? '<button class="btn" id="memo-cancel">やめる</button>' : '') +
          '<span id="memo-status" class="status"></span></div></div>' +
        (tk ? '<div class="tokbox"><div class="row meta">書き込み：設定済み'+(ls('wb_token_shared') ? '（共有トークンを使用中）' : '')+'</div>' +
          '<div class="row"><button class="btn" id="tok-share">この端末のトークンを全端末で使う</button><button class="btn" id="tok-unshare">全端末での共有をやめる</button></div>' +
          '<p class="meta" style="margin:0">「全端末で使う」を押してパスワードを決めると、ほかの端末は最初に1回パスワードを入れるだけで書き込めます。</p>' +
          '<div class="row"><button class="btn" id="memo-token-clear" style="padding:2px 10px;font-size:.75rem">この端末の設定を解除</button><span class="status" id="tok-status"></span></div></div>' : '') +
      '</div><div class="sec">' +
        '<input type="search" id="memo-q" placeholder="メモを検索" value="'+esc(query)+'">' +
        '<div class="mfilter"><button data-c=""'+(filterCat ? '' : ' aria-pressed="true"')+'>すべて <span class="mono">'+hit.length+'</span></button>' +
          CATS.map(function(c){ var n = hit.filter(function(m){ return catsOf(m).indexOf(c) >= 0; }).length;
            return '<button data-c="'+esc(c)+'"'+(filterCat === c ? ' aria-pressed="true"' : '')+'>'+esc(c)+' <span class="mono">'+n+'</span></button>'; }).join('') + '</div>' +
        '<div class="row meta">並び順 <span class="seg"><button data-v="date"'+(view==='date'?' aria-pressed="true"':'')+'>新しい順</button><button data-v="cat"'+(view==='cat'?' aria-pressed="true"':'')+'>分類ごと</button></span></div>' +
        '<div class="memos">' + listHtml + '</div>' +
      '</div></div>';

    var ta = root.querySelector('#memo-input');
    ta.oninput = function(){ if (!editing) ls(DRAFT_KEY, ta.value); };
    root.querySelectorAll('.catpick input').forEach(function(cb){
      cb.onchange = function(){ selCats = Array.prototype.filter.call(root.querySelectorAll('.catpick input'), function(x){ return x.checked; }).map(function(x){ return x.value; }); };
    });
    root.querySelectorAll('.mfilter button').forEach(function(b){ b.onclick = function(){ filterCat = b.dataset.c; draw(); }; });
    root.querySelectorAll('.seg button').forEach(function(b){ b.onclick = function(){ view = b.dataset.v; ls('wb_memo_view', view); draw(); }; });
    var q = root.querySelector('#memo-q');
    q.oninput = function(){ query = q.value; var pos = q.selectionStart; draw(); var n = root.querySelector('#memo-q'); n.focus(); n.setSelectionRange(pos,pos); };
    var ts = root.querySelector('#memo-token-save');
    if (ts) ts.onclick = function(){ var v = root.querySelector('#memo-token').value.trim(); if (!v) return; ls(TOKEN_KEY, v); load(); };
    var tc = root.querySelector('#memo-token-clear');
    if (tc) tc.onclick = function(){ ls(TOKEN_KEY, null); ls('wb_token_shared', null); draw(); };
    var tul = root.querySelector('#tok-unlock'); if (tul) tul.onclick = function(){ needToken(); };
    var ts2 = root.querySelector('#tok-share'), tu = root.querySelector('#tok-unshare'), tst = root.querySelector('#tok-status');
    if (ts2) ts2.onclick = function(){
      passwordModal('全端末で使えるようにしますか？', '共有パスワードを決めてください。ほかの端末では、最初に1回このパスワードを入れると書き込めるようになります（URLを知っているだけでは書き込めません）。', '全端末で使う', async function(pw){
        await shareToken(pw); toast('全端末で使えるようにしました');
      });
    };
    if (tu) tu.onclick = function(){
      confirmModal('全端末での共有をやめますか？', 'ボードに置いた暗号化トークンを消します。ほかの端末は、次に開いたときから書き込めなくなります（この端末はそのまま使えます）。', '共有をやめる', async function(){
        tst.textContent = '処理中…'; tst.className = 'status';
        try { await unshareToken(); tst.textContent = ''; toast('共有をやめました'); }
        catch(err) { tst.textContent = err.message; tst.className = 'status err'; }
      });
    };
    var cancel = root.querySelector('#memo-cancel');
    if (cancel) cancel.onclick = function(){ editing = null; selCats = []; draw(); };
    root.querySelector('#memo-save').onclick = async function(){
      var text = ta.value.trim(); if (!text) { setStatus('メモを入力してください', true); return; }
      var cats = selCats.length ? selCats.slice() : ['その他'];
      var now = new Date().toISOString(), id = editing;
      var ok = await save(function(cur){
        if (id) return cur.map(function(m){ return m.id === id ? Object.assign({}, m, {text:text, cats:cats, updated:now}) : m; });
        return cur.concat([{id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text:text, cats:cats, created:now, updated:now, pinned:false}]);
      }, id ? 'edit memo' : 'add memo');
      if (ok) { if (!id) ls(DRAFT_KEY, null); editing = null; selCats = []; draw(); setStatus('保存しました'); }
    };
    root.querySelectorAll('.acts button').forEach(function(b){
      b.onclick = async function(){
        var id = b.dataset.id, a = b.dataset.a;
        if (a === 'edit') { editing = id; var m = memos.find(function(x){ return x.id === id; }); selCats = (m && m.cats) ? m.cats.slice() : []; draw(); root.querySelector('#memo-input').focus(); }
        else if (a === 'ask') { confirmDel = id; draw(); }
        else if (a === 'nodel') { confirmDel = null; draw(); }
        else if (a === 'del') { confirmDel = null; await save(function(cur){ return cur.filter(function(m){ return m.id !== id; }); }, 'delete memo'); }
        else if (a === 'pin') { await save(function(cur){ return cur.map(function(m){ return m.id === id ? Object.assign({}, m, {pinned: !m.pinned}) : m; }); }, 'pin memo'); }
      };
    });
  }

  return {mount:mount, load:load, loaded:false};
})();

load();
setInterval(function(){ if (!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
window.addEventListener('focus', function(){ load(); });
window.addEventListener('hashchange', function(){ location.reload(); });
})();
</script>
