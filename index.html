<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>やることボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F5F2; --surface:#FFFFFF; --line:#E1E3DE; --ink:#1D2127; --muted:#666C74;
  --accent:#2E4C88; --accent-soft:#E6ECF7;
  --urgent:#B93A12; --urgent-soft:#FBEAE3;
  --done:#2D7A4C; --done-soft:#E3F2E8;
  --warn:#9A6A0B; --warn-soft:#FBF1DC;
  --idle:#C9CCC6; --today:#FFF8E6;
  --scene-bg:#DDE3E8; --floor:#C9C2B6; --wall:#EEF0EC; --wood:#B0835A;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#15181D; --surface:#1D2128; --line:#2E333C; --ink:#E8EAED; --muted:#9AA0A9;
    --accent:#8FAEE8; --accent-soft:#25304A;
    --urgent:#F08A62; --urgent-soft:#3A2219;
    --done:#6CC892; --done-soft:#1B3326;
    --warn:#E3B556; --warn-soft:#352B14;
    --idle:#3A3F48; --today:#2A2618;
    --scene-bg:#1A1F27; --floor:#3A3631; --wall:#262B33; --wood:#7A5A3E;
  }
}
*{box-sizing:border-box}
#shell{overflow-x:clip}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap,.sec{grid-template-columns:minmax(0,1fr)}
.wrap .wrap{margin-inline:0;width:100%;max-width:none}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:28px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.55rem}
h2{font-size:1.1rem;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-size:.8rem;font-weight:500;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{display:grid;gap:14px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header + tabs */
.top{display:grid;grid-template-columns:1fr auto;gap:16px 20px;align-items:end}
.top p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.count{background:var(--urgent-soft);color:var(--urgent);border-radius:10px;padding:10px 16px;display:grid;gap:2px;text-align:right}
.count .lbl{font-size:.76rem;font-weight:700;letter-spacing:.04em}
.count .num{font-size:1.7rem;font-weight:700;line-height:1.1}
.count .num span{font-size:.9rem;margin-left:2px}
.count .sub{font-size:.74rem}
.reload{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:.72rem;font-weight:700;padding:1px 10px;color:var(--muted);vertical-align:1px}
.reload[disabled]{opacity:.5}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;justify-self:start;grid-column:1/-1}
.tabs button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:700;font-size:.86rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:.75rem;color:var(--muted);font-weight:700;text-align:center;letter-spacing:.06em}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:104px;display:flex;flex-direction:column;gap:5px}
.day.past{opacity:.55}
.day.today{background:var(--today);border-color:var(--warn)}
.day .dn{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.day.today .dn b{color:var(--warn)}
.day.sun .dn{color:var(--urgent)}
.day.wkend{background:var(--bg)}
.day .dn .off{font-size:.72rem;font-weight:700}
.ev{font:inherit;color:inherit;text-align:left;width:100%;border:0;cursor:pointer;font-size:.78rem;line-height:1.45;border-radius:5px;padding:4px 6px;background:var(--accent-soft);border-left:3px solid var(--accent)}
.ev.deadline{background:var(--warn-soft);border-left-color:var(--warn)}
.ev.event{background:var(--urgent-soft);border-left-color:var(--urgent);font-weight:700}
.ev.duty{background:var(--bg);border-left-color:var(--muted);color:var(--muted);font-weight:700}
.ev .tm{font-family:var(--mono);margin-right:4px}
.ev{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ev.dragging{opacity:.35}
.dragghost{position:fixed;z-index:80;pointer-events:none;box-shadow:0 8px 24px rgb(0 0 0 / .25);transform:rotate(-2deg) scale(1.04);border-radius:6px}
.dropline{height:3px;border-radius:2px;background:var(--accent);margin:-1px 0;box-shadow:0 0 0 2px var(--accent-soft)}
.day.dropover{outline:3px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--surface);border-radius:999px;padding:8px 18px;font-size:.86rem;font-weight:700;box-shadow:0 4px 14px rgb(0 0 0 / .25);max-width:calc(100% - 32px)}
.toast-act{margin-left:12px;border:0;background:none;color:#9CC0FF;font-weight:700;font-size:.86rem;padding:2px 4px;text-decoration:underline}
.donebtn{font:inherit;color:inherit;text-align:left;border:0;background:none;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:4px 6px;margin:0;border-radius:6px;cursor:pointer}
.donebtn .dtxt{overflow-wrap:anywhere}
.done-list li{min-width:0}
.donebtn:hover{background:var(--bg)}
.donebtn .undo{margin-left:auto;font-size:.72rem;color:var(--accent);font-weight:700;flex:none}
.toast.err{background:var(--urgent)}
.td-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.td-card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:12px;padding:12px 14px;display:grid;gap:10px;align-content:start}
.td-head{display:flex;align-items:center;gap:8px}
.td-head b{font-size:1rem}
.td-dot{width:14px;height:14px;border-radius:50%;background:var(--pc)}
.td-duty{font-size:.7rem;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.td-duty.off{background:#EFE8FA;color:#6B4E9B;border-color:#D8CCEE}
.ev.off.half,.td-duty.off.half{background:#F6F2FC;border-left-style:dashed;opacity:.85}
.ev.off{background:#EFE8FA;border-left-color:#B7A6D6;color:#6B4E9B;font-weight:700}
.tag.offtag{background:#EFE8FA;color:#6B4E9B}
.td-n{margin-left:auto;font-size:.78rem;color:var(--muted)}
.td-card ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.td-item{display:flex;gap:6px;align-items:stretch}
.td-main{flex:1;min-width:0;font:inherit;color:inherit;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;display:grid;gap:3px;cursor:pointer;border-left:4px solid var(--pc)}
.td-item.late .td-main{border-left-color:var(--urgent);background:var(--urgent-soft)}
.td-kind{justify-self:start;font-size:.68rem;font-weight:700;border-radius:999px;padding:0 7px;background:var(--accent-soft);color:var(--accent)}
.td-kind.deadline{background:var(--warn-soft);color:var(--warn)}
.td-kind.late{background:var(--urgent);color:#fff}
.td-time{font-size:.8rem;color:var(--muted)}
.td-title{font-weight:700;font-size:.92rem;overflow-wrap:anywhere}
.td-task{font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.td-done{border:1px solid var(--done);background:var(--surface);color:var(--done);border-radius:10px;font-weight:700;font-size:.8rem;padding:0 10px;min-width:56px}
.td-done:hover{background:var(--done);color:var(--surface)}
.td-item.fin .td-main{opacity:.55;border-left-color:var(--done)}
.td-item.fin .td-title{text-decoration:line-through}
.td-kind.fin{background:var(--done-soft);color:var(--done)}
.ev.evdone{opacity:.5;text-decoration:line-through}
.td-empty{margin:0;font-size:.86rem;color:var(--muted)}
.td-event{background:var(--urgent-soft);color:var(--urgent);border-radius:10px;padding:10px 14px;font-size:.9rem}
.addev{border:1px dashed var(--line);background:none;border-radius:6px;font-size:.74rem;color:var(--muted);padding:3px 0;margin-top:auto}
.addev:hover{border-color:var(--accent);color:var(--accent)}
.tbtn{font:inherit;color:inherit;text-align:left;border:0;background:none;padding:6px;margin:-6px;border-radius:8px;width:calc(100% + 12px);cursor:pointer}
.tbtn:hover{background:var(--bg)}
.card{grid-template-columns:minmax(0,1fr)}
.card > *,.card li{min-width:0}
.tbtn.tcard{overflow-wrap:anywhere}
.card ul:has(.tcard){gap:8px}
.tbtn.tcard{margin:0;width:100%;padding:10px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--accent);gap:5px}
.tbtn.tcard:hover{border-color:var(--accent)}
.tbtn.tcard[data-p="最優先"]{border-left-color:var(--urgent)}
.tbtn.tcard[data-p="優先"]{border-left-color:#E07A2E}
.tbtn.tcard[data-p="通常"]{border-left-color:var(--accent)}
.tbtn.tcard[data-p="低"],.tbtn.tcard[data-p="未分類"]{border-left-color:var(--idle)}
.tbtn.tcard > span:nth-child(2){font-weight:500;line-height:1.55}
.tagrow{display:flex;gap:4px;flex-wrap:wrap}
.tag.cat{background:var(--bg);color:var(--muted)}
.tag.whotag{background:var(--done-soft);color:var(--done)}
.ctag{display:inline-block;font-size:.64rem;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 6px;margin-right:4px;vertical-align:1px}
.evicon{display:inline-flex;align-items:center;gap:1px;vertical-align:-3px;margin-right:4px;color:var(--accent)}
.evicon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.evicon b{font-size:.62rem;font-weight:700;line-height:1;background:var(--accent);color:var(--surface);border-radius:4px;padding:2px 3px;margin-left:1px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.iconpick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:40px;padding:0 8px;font-size:.78rem;font-weight:700;color:var(--muted)}
.iconpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.iconpick .evicon{margin:0}
.rtag{display:inline-block;font-size:.64rem;font-weight:700;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:0 5px;margin-right:4px;vertical-align:1px;background:var(--surface)}
.ev.recur{border-left-style:dashed}
.ev .who{display:inline-block;font-size:.68rem;font-weight:700;background:var(--done-soft);color:var(--done);border-radius:999px;padding:0 6px;margin-right:5px;vertical-align:1px}
.whofilter{display:flex;flex-wrap:wrap;gap:6px}
.whofilter button,.whopick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.whofilter button[aria-pressed="true"],.whopick button[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.wdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0;box-shadow:0 0 0 1.5px var(--surface)}
.whopick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.rep-on{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rep-on .btn{margin-left:auto;padding:5px 12px;font-size:.8rem}
.tag.rec{background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent)}
.ev.virtual{opacity:.6;border-left-style:dashed;cursor:default;order:1}
.day .ev.duty{order:2}
.day .addev{order:3}
.seg.wide.rc3{grid-template-columns:repeat(4,1fr)}
.seg.wide.rc3 button{font-size:.74rem;padding:9px 2px}
.tag.web{background:var(--warn-soft);color:var(--warn)}
.tag.最優先{background:var(--urgent);color:var(--surface)}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.h2row .btn{padding:6px 14px}
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));display:grid;gap:12px;max-height:88vh;overflow:auto;box-shadow:0 -6px 24px rgb(0 0 0 / .2)}
.sheet{animation:sheetUp .24s ease-out}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin:-8px 0 2px}
@media (min-width:761px){.grab{display:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font-size:1.05rem}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:.76rem;color:var(--muted);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=date],input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.seg.wide{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#ev-kind.seg.wide{grid-template-columns:repeat(5,1fr)}
#ev-kind.seg.wide button{font-size:.76rem;padding:9px 0}
.seg.wide button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-size:.84rem;font-weight:700;color:var(--muted)}
.seg.wide button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ok-fill{background:var(--done);border-color:var(--done);color:var(--surface)}
.btn.danger-fill{background:var(--urgent);border-color:var(--urgent);color:var(--surface)}
.push-right{margin-left:auto}
.modal-bg{position:fixed;inset:0;z-index:100;background:rgb(0 0 0 / .5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px 18px 16px;width:min(400px,100%);display:grid;gap:10px;box-shadow:0 12px 40px rgb(0 0 0 / .3)}
.modal h3{font-size:1.05rem}
.cm-body{margin:0;font-size:.88rem;color:var(--muted)}
.cm-row{justify-content:flex-end;margin-top:4px}
.btn.ok{color:var(--done);border-color:var(--done)}
.warnline{margin:0;font-size:.8rem;color:var(--warn)}
body.noscroll{overflow:hidden}
@media (min-width:761px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* pipeline */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.88rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-size:.76rem;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--bg)}
th.st,td.st{text-align:center;width:60px}
.code{font-family:var(--mono);font-size:.84rem;color:var(--accent);white-space:nowrap}
.name{font-weight:700}
.note{color:var(--muted);font-size:.82rem}
.pipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.pc-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font:inherit;color:inherit;text-align:left;border:0;background:none;padding:4px;margin:-4px;border-radius:8px;cursor:pointer;width:calc(100% + 8px)}
.pc-h:hover{background:var(--bg)}
.pc .pc-h{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"code who edit" "name name name";align-items:center;gap:4px 8px}
.pc .pc-h .code{grid-area:code;font-size:.9rem}
.pc .pc-h .whotag,.pc .pc-h .pc-nowho{grid-area:who;justify-self:end}
.pc .pc-h .pc-edit{grid-area:edit;margin:0}
.pc .pc-h .name{grid-area:name;font-size:1rem;line-height:1.4;min-height:1.4em}
.pc-edit{margin-left:auto;font-size:.72rem;color:var(--accent);font-weight:700}
.arch-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--done-soft);color:var(--done);border-radius:8px;padding:6px 6px 6px 12px;font-size:.84rem;font-weight:700}
.pdone{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.pdone summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted)}
.pdone ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.pc-st{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.dotbtn{border:0;background:none;padding:8px 0 6px;border-radius:8px;display:grid;justify-items:center;gap:4px;min-height:52px}
.dotbtn span{font-size:.7rem;color:var(--muted);font-weight:700}
.dotbtn .dot{width:20px;height:20px}
.dotbtn:hover,.dotbtn:active{background:var(--accent-soft)}
.dotmenu{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgb(0 0 0 / .18);padding:6px;display:grid;min-width:170px}
.dotmenu .dm-h{font-size:.74rem;color:var(--muted);font-weight:700;padding:4px 8px}
.dotmenu button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;display:flex;gap:8px;align-items:center;font-size:.86rem}
.dotmenu button:hover,.dotmenu button:focus-visible{background:var(--bg)}
.dotmenu button[aria-current]{font-weight:700}
.pipe-note{font-size:.8rem;color:var(--muted)}
.pipe-note.err{color:var(--urgent)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--idle);vertical-align:middle}
.dot.done{background:var(--done)}
.dot.now{background:var(--surface);border:3px solid var(--accent)}
.dot.hot{background:var(--surface);border:3px solid var(--urgent)}
.dot.wait{background:var(--surface);border:3px dashed var(--warn)}

/* cards */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.card h3{font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.card h3 .mono{color:var(--muted);font-weight:500;font-size:.8rem}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:.88rem}
.task{display:grid;gap:3px}
.tag{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;justify-self:start}
.tag.最優先{background:var(--urgent);color:var(--surface)}
.tag.優先{background:var(--urgent-soft);color:var(--urgent)}
.tag.通常{background:var(--accent-soft);color:var(--accent)}
.tag.未分類,.tag.後回し,.tag.低{background:var(--bg);color:var(--muted)}
.meta{font-size:.74rem;color:var(--muted)}
.q{border-color:var(--warn)}
.q h3{color:var(--warn)}
.q ul{list-style:disc;padding-left:1.2em}
.done-list li{color:var(--muted)}
footer{color:var(--muted);font-size:.78rem}

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var app = document.getElementById('app');
var W = ['日','月','火','水','木','金','土'];
var REPO = 'knotscheme/work-board';
var ORDER = ['企画・サンプル','撮影','商品画像','動画','LP・文章','商品登録・在庫','事務・受注・発注','販促・SNS・イベント','OEM事業','アプリ開発','Web制作','クライアント案件','その他'];
var STALE_DAYS = 30;
var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var STATE_JP = {working:'作業中', decision:'確認待ち（挙手）', stale:'放置（30日以上）', idle:'待機'};

var KEY = null, cryptoKey = null, DATA = null, tab = 'board';

/* ---------- utils ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fromB64(s){ s = s.replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,''); while(s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
function toB64(u){ var s = ''; for (var i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jpDate(x){ var d = new Date(x); return (d.getMonth()+1)+'/'+d.getDate()+'（'+W[d.getDay()]+'）'; }
function jpDateTime(x){ var d = new Date(x); return jpDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

async function decryptJSON(enc){
  var buf = await crypto.subtle.decrypt({name:'AES-GCM', iv: fromB64(enc.iv)}, cryptoKey, fromB64(enc.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function encryptJSON(obj){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv: iv}, cryptoKey, new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({v:1, iv: toB64(iv), ct: toB64(ct)});
}
function ghToken(){ return ls('wb_token'); }
// 共有トークン：鍵付きURLで開いた端末なら設定なしで書き込めるよう、トークンをURLの鍵で暗号化して置いておく
// 共有トークンはパスワードでもう一段暗号化する（URLを知っているだけでは書き込めない）
var SHARED_PW = null;   // {salt, iv, ct}：パスワードで解く共有トークン
async function pwKey(pw, salt){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function loadSharedToken(){
  SHARED_PW = null;
  try {
    var r = await fetch('token.enc.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    var tk = await decryptJSON(await r.json());
    if (tk && tk.pw) SHARED_PW = tk.pw;
  } catch(e) {}
}
// パスワードが合えば、この端末でトークンを使えるようにする
async function unlockShared(pw){
  if (!SHARED_PW) throw new Error('共有されたトークンがありません。');
  try {
    var k = await pwKey(pw, fromB64(SHARED_PW.salt));
    var buf = await crypto.subtle.decrypt({name:'AES-GCM', iv: fromB64(SHARED_PW.iv)}, k, fromB64(SHARED_PW.ct));
    ls('wb_token', new TextDecoder().decode(buf)); ls('wb_token_shared', '1');
  } catch(e) { throw new Error('パスワードが違います。'); }
}
async function shareToken(pw){
  var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  var k = await pwKey(pw, salt);
  var ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv: iv}, k, new TextEncoder().encode(ghToken())));
  var pwObj = {salt: toB64(salt), iv: toB64(iv), ct: toB64(ct)};
  await ghUpdate('token.enc.json', function(){ return {pw: pwObj, updated: new Date().toISOString()}; }, 'share token');
  SHARED_PW = pwObj;
}

// パスワード入力つきの確認画面
function passwordModal(title, body, okLabel, onOk){
  var bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pm-title"><h3 id="pm-title">'+esc(title)+'</h3>' +
    (body ? '<p class="cm-body">'+esc(body)+'</p>' : '') +
    '<label class="fld"><span>パスワード</span><input type="password" id="pm-pw" autocomplete="off" inputmode="text"></label>' +
    '<span class="status" id="pm-st"></span>' +
    '<div class="row cm-row"><button class="btn" id="pm-no">キャンセル</button><button class="btn primary" id="pm-ok">'+esc(okLabel)+'</button></div></div>';
  document.body.appendChild(bg);
  var inp = bg.querySelector('#pm-pw'), stEl = bg.querySelector('#pm-st');
  function close(){ bg.remove(); }
  bg.addEventListener('click', function(e){ if (e.target === bg) close(); });
  bg.querySelector('#pm-no').onclick = close;
  async function go(){
    var pw = inp.value;
    if (pw.length < 4) { stEl.textContent = '4文字以上で入れてください'; stEl.className = 'status err'; return; }
    stEl.textContent = '確認中…'; stEl.className = 'status';
    try { await onOk(pw); close(); } catch(err) { stEl.textContent = err.message; stEl.className = 'status err'; }

function swipeToClose(sh){
  var y0 = null, dy = 0, t0 = 0, dragging = false;
  sh.addEventListener('touchstart', function(e){
    if (sh.scrollTop > 0 || e.touches.length > 1) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); dragging = false;
  }, {passive:true});
  sh.addEventListener('touchmove', function(e){
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (!dragging && dy > 8 && sh.scrollTop <= 0) { dragging = true; sh.style.transition = 'none'; }
    if (!dragging) { if (dy < 0) y0 = null; return; }
    e.preventDefault();
    sh.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
  }, {passive:false});
  function end(){
    if (!dragging) { y0 = null; return; }
    var fast = dy / Math.max(1, Date.now() - t0) > .6;
    sh.style.transition = 'transform .22s ease';
    if (dy > 110 || (fast && dy > 40)) { sh.style.transform = 'translateY(100%)'; setTimeout(Sheet.close, 200); }
    else sh.style.transform = '';
    y0 = null; dragging = false;
  }
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
}

function toast(text, err, action){
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = text; t.classList.toggle('err', !!err); t.hidden = false;
  if (action) {
    var b = document.createElement('button'); b.className = 'toast-act'; b.textContent = action.label;
    b.onclick = function(){ t.hidden = true; action.fn(); };

// 完了したタスクの、明日以降の予定（作業予定・締切）を消す。今日までは記録として残す
async function removeFutureEvents(taskId){
  var today = dayKey(0);
  if (!(DATA.board.events || []).some(function(e){ return e.task === taskId && e.date > today; })) return;
  try {
    var res = await ghUpdate('events.enc.json', function(d){
      var evs = JSON.parse(JSON.stringify((d && d.events) || DATA.board.events || []));
      return {events: evs.filter(function(e){ return !(e.task === taskId && e.date > today); }), updated: new Date().toISOString()};
    }, 'remove future events');
    DATA.board.events = res.events; renderBoard(); Office.update();
  } catch(e) {}
}

async function moveEvent(i, date, beforeEi){
  var all = DATA.board.events, orig = all[i];
  if (!orig) return;
  if (!ghToken()) return needToken();
  var base = JSON.parse(JSON.stringify(all));
  // その日の並び（動かす予定を除く）に、落とした位置で差し込む
  var day = all.filter(function(e, k){ return e.date === date && k !== i && e.kind !== 'duty'; }).sort(evOrder(all));
  var pos = beforeEi != null ? day.indexOf(all[beforeEi]) : -1;
  if (pos < 0) pos = day.length;
  var moved = Object.assign({}, orig, {date: date});
  day.splice(pos, 0, moved);
  var originals = day.map(function(e){ return e === moved ? orig : e; });   // 保存側で探すための元の姿
  var updated = day.map(function(e, k){ return Object.assign({}, e, {order: k}); });
  if (orig.date === date && day.every(function(e, k){ return (e === moved ? orig : e).order === k; }) && beforeEi == null) return;
  // 先に見た目を動かす
  DATA.board.events = all.map(function(e){ var k = originals.indexOf(e); return k >= 0 ? updated[k] : e; });
  renderBoard(); Office.update();
  try {
    var res = await ghUpdate('events.enc.json', function(d){
      var evs = JSON.parse(JSON.stringify((d && d.events) || base));
      originals.forEach(function(o, k){
        var j = evs.findIndex(function(x){ return sameEv(x, o); });
        if (j >= 0) evs[j] = updated[k]; else if (o === orig) evs.push(updated[k]);
      });
      return {events: evs, updated: new Date().toISOString()};
    }, 'move event');
    DATA.board.events = res.events; renderBoard(); Office.update();
    var dd = new Date(date + 'T00:00:00');
    toast(orig.date === date ? '順番を入れ替えました' : jpDate(dd) + ' に移動しました' + ((dd.getDay() === 0 || dd.getDay() === 6) && (moved.kind === 'plan' || moved.kind === 'deadline') ? '（土日は休みの設定です）' : ''));
  } catch(err) {
    DATA.board.events = base; renderBoard(); Office.update();
    toast(err.message, true);
  }
}

function bindEventDrag(vb){
  var drag = null;
  function dayAt(x, y){ var el = document.elementFromPoint(x, y); return el && el.closest('.day[data-date]'); }
  function begin(el, x, y){
    var r = el.getBoundingClientRect();
    drag = {el: el, ghost: el.cloneNode(true), dx: x - r.left, dy: y - r.top, over: null};
    drag.ghost.classList.add('dragghost'); drag.ghost.style.width = r.width + 'px';
    document.body.appendChild(drag.ghost);
    el.classList.add('dragging');
    try { if (navigator.vibrate) navigator.vibrate(15); } catch(e) {}
    move(x, y);
  }
  var line = document.createElement('div'); line.className = 'dropline';
  function move(x, y){
    drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px';
    drag.ghost.style.display = 'none'; var d = dayAt(x, y); drag.ghost.style.display = '';
    if (drag.over && drag.over !== d) drag.over.classList.remove('dropover');
    if (d) d.classList.add('dropover');
    drag.over = d; drag.before = null;
    if (d) {
      var cards = [].slice.call(d.querySelectorAll('.ev[data-ei]')).filter(function(c){ return c !== drag.el && c.dataset.ei; });
      var next = cards.filter(function(c){ var r = c.getBoundingClientRect(); return y < r.top + r.height / 2; })[0];
      drag.before = next ? +next.dataset.ei : null;
      var anchor = next || d.querySelector('.addev');
      if (anchor) anchor.parentNode.insertBefore(line, anchor); else d.appendChild(line);
    } else if (line.parentNode) line.remove();
    if (y < 70) window.scrollBy(0, -14); else if (y > window.innerHeight - 110) window.scrollBy(0, 14);
  }
  function end(){
    var d = drag.over, el = drag.el, before = drag.before;
    drag.ghost.remove(); el.classList.remove('dragging'); if (d) d.classList.remove('dropover');
    if (line.parentNode) line.remove();
    drag = null;
    el.dataset.dragged = '1'; setTimeout(function(){ delete el.dataset.dragged; }, 60);
    if (d) moveEvent(+el.dataset.ei, d.dataset.date, before);
  }
  vb.querySelectorAll('.ev[data-ei]').forEach(function(el){
    el.addEventListener('mousedown', function(e){
      if (e.button) return;
      var sx = e.clientX, sy = e.clientY, started = false;
      function mm(ev){
        if (!started && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 6) { started = true; begin(el, ev.clientX, ev.clientY); }
        if (started) { ev.preventDefault(); move(ev.clientX, ev.clientY); }
      }
      function mu(){ document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); if (started) end(); }
      document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', function(e){
      var t0 = e.touches[0], sx = t0.clientX, sy = t0.clientY, lx = sx, ly = sy;
      var timer = setTimeout(function(){ begin(el, lx, ly); }, 380);
      function tm(ev){
        var t = ev.touches[0]; lx = t.clientX; ly = t.clientY;
        if (!drag) { if (Math.abs(lx - sx) + Math.abs(ly - sy) > 8) clearTimeout(timer); return; }
        ev.preventDefault(); move(lx, ly);
      }
      function te(){
        clearTimeout(timer);
        el.removeEventListener('touchmove', tm); el.removeEventListener('touchend', te); el.removeEventListener('touchcancel', te);
        if (drag) end();
      }
      el.addEventListener('touchmove', tm, {passive: false}); el.addEventListener('touchend', te); el.addEventListener('touchcancel', te);
    }, {passive: true});
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  });
}

// ---------- 定期タスク ----------
function recRuleLabel(r){
  if (r.rule.type === 'monthly') return '毎月' + r.rule.day + '日';
  if (r.rule.type === 'daily') return '毎日（平日）';
  if (r.rule.dow != null) return '毎週' + W[r.rule.dow] + '曜';
  return '毎週（曜日自由）';
}
// その日が締切の回で、まだタスクになっていないもの（毎月の分だけ）
// その日に来る定期タスクの回のうち、まだタスクになっていないもの（カレンダーに点線で出す）
function recurringOn(key){
  var d = new Date(key + 'T00:00:00'), today = dayKey(0), w = d.getDay();
  var made = DATA.pending.concat(DATA.done || []).map(function(t){ return t.rk; });
  function mon(){ var m = new Date(d); m.setDate(m.getDate() - ((w + 6) % 7)); return ymd(m); }
  return ((DATA.board && DATA.board.recurring) || []).filter(function(r){
    if (!whoMatch(r.assignee || '')) return false;
    var rk;
    if (r.rule.type === 'monthly') { if (d.getDate() !== r.rule.day) return false; rk = r.id + ':' + key.slice(0, 7); }
    else if (r.rule.type === 'daily') { if (key <= today || w === 0 || w === 6 || isDutyDay(key, r.assignee)) return false; rk = r.id + ':' + key; }
    else if (r.rule.dow != null) { if (w !== r.rule.dow || key < today) return false; rk = r.id + ':' + mon(); }
    else return false;
    return made.indexOf(rk) < 0;
  });
}
// タスクのシートに出す「くり返し」欄。すでに定期なら設定へのボタンを出す
function recOfTask(t){
  if (!t) return -1;
  var recs = (DATA.board && DATA.board.recurring) || [], id = t.rk ? t.rk.split(':')[0] : null;

function repeatField(t){

    '<select id="tk-rep-day" hidden>'+Array.from({length:28}, function(_, i){ return '<option value="'+(i+1)+'"'+(i === 9 ? ' selected' : '')+'>毎月'+(i+1)+'日</option>'; }).join('')+'</select>' +
    '<select id="tk-rep-dow" hidden>'+[1,2,3,4,5].map(function(n){ return '<option value="'+n+'">毎週'+W[n]+'曜</option>'; }).join('')+'</select></div></div>';

  }).join('');

/* ---------- 部署の状態 ---------- */
function dayKey(offset){ var d = new Date(); d.setDate(d.getDate() + (offset||0)); return ymd(d); }
function eventCat(e){
  if (e.cat) return e.cat;
  var t = e.task && DATA.pending.filter(function(x){ return x.id === e.task; })[0];
  return t ? t.category : null;
}
function eventsOn(key){ return ((DATA.board && DATA.board.events) || []).filter(function(e){ return e.date === key; }); }
// 半日休み（午前・午後・半休・AM・PM）は作業を入れてよい日として扱う
function isHalfOff(e){ return e.kind === 'off' && (e.half || /午前|午後|半休|半日|AM|PM/i.test(e.title || '')); }
function isDutyDay(key, who){ return eventsOn(key).some(function(e){ return (e.kind === 'duty' || (e.kind === 'off' && !isHalfOff(e))) && (!who || !e.assignee || e.assignee === who); }); }
function isOffDay(key, who){ return eventsOn(key).some(function(e){ return e.kind === 'off' && (!who || !e.assignee || e.assignee === who); }); }
function dutyNames(key){ return eventsOn(key).filter(function(e){ return e.kind === 'duty'; }).map(function(e){ return e.assignee || '全員'; }); }

var STAGE_CAT = {'企画':'企画・サンプル','撮影':'撮影','画像':'商品画像','LP':'LP・文章','登録':'商品登録・在庫','販促':'販促・SNS・イベント'};
// 品番がいま担当している工程：今週やる > 次の作業 > 待ち の順で最初のもの
function activeStage(p, stages){
  var order = ['hot','now','wait'];
  for (var k = 0; k < order.length; k++) {
    var j = (p.s || []).indexOf(order[k]);
    if (j >= 0) return {code:p.code, name:p.name, stage:stages[j], state:order[k], cat:STAGE_CAT[stages[j]]};
  }
  return null;
}

// 白川は担当なしのタスクも受け持つ
function assigneeMatch(owner, t){ return owner === '白川' ? (!t.assignee || t.assignee === '白川') : t.assignee === owner; }

function deptStates(owner, depts){
  var b = DATA.board || {}, now = Date.now(), out = {}, today = dayKey(0), soonEnd = dayKey(2);
  var events = b.events || [];
  depts.forEach(function(d){
    var tasks = DATA.pending.filter(function(t){ return t.category === d.cat && assigneeMatch(owner, t); }).sort(function(a,b){ return b.score - a.score; });
    var qs = owner === '白川' ? (b.questions || []).filter(function(q){ return q.cat === d.cat; }) : [];
    var stale = tasks.filter(function(t){ return now - new Date(t.recorded) > STALE_DAYS*86400000; });
    var mine = events.filter(function(e){ var w = whoOfEvent(e); return eventCat(e) === d.cat && (owner === '白川' ? (!w || w === '白川') : w === owner); });
    var todayEv = mine.filter(function(e){ return e.date === today && e.kind !== 'duty'; });
    var soon = mine.filter(function(e){ return (e.kind === 'deadline' || e.kind === 'event') && e.date >= today && e.date <= soonEnd; });
    var products = (b.pipeline || []).filter(function(p){ return !p.done && (owner === '白川' ? (!p.assignee || p.assignee === '白川') : p.assignee === owner); })
      .map(function(p){ return activeStage(p, b.stages || []); }).filter(function(a){ return a && a.cat === d.cat; });
    var state = stale.length ? 'stale' : qs.length ? 'decision' : (tasks.length || products.length) ? 'working' : 'idle';
    out['T:'+d.cat] = {dept:d, tasks:tasks, qs:qs, stale:stale, state:state, today:todayEv, soon:soon, products:products};
  });
  return out;
}

var LAST_SIG = '', LOADING = false, BUILD = 'e4f87c7f4c8a';
// 新しい版が公開されていたら、キャッシュを避けて読み直す
async function checkVersion(){
  if (BUILD.indexOf('BUILD') >= 0) return;
  try {
    var r = await fetch('version.txt?t=' + Date.now(), {cache:'no-store'});
    var v = r.ok ? (await r.text()).trim() : '';
    if (v && v !== BUILD && /^[0-9a-f]{12}$/.test(v)) location.replace(location.pathname + '?v=' + v + location.hash);
  } catch(e) {}
}
async function load(force){
  if (LOADING) return; LOADING = true;
  checkVersion();
  try { await loadInner(force); } finally { LOADING = false; }
}
async function loadInner(force){
  KEY = location.hash.slice(1);
  if (!KEY) return fail('鍵付きのURL（末尾に # から始まる文字列があるもの）で開いてください。');
  try {
    if (!cryptoKey) cryptoKey = await crypto.subtle.importKey('raw', fromB64(KEY), 'AES-GCM', false, ['encrypt','decrypt']);
    var fresh = null;
    if (ghToken()) { try { fresh = (await ghRead('data.enc.json')).data; } catch(e) {} }
    if (!fresh) { var res = await fetch('data.enc.json?t=' + Date.now(), {cache:'no-store'}); fresh = await decryptJSON(await res.json()); }
    DATA = fresh;
  } catch(e) {
    if (document.getElementById('shell')) return;   // 2回目以降の失敗は今の表示のまま
    return fail('鍵が正しくないか、データを読み込めませんでした。URLの末尾まで正しくコピーされているか確認してください。');
  }
  await loadSharedToken();
  try {
    var pipe = await readWeb('pipeline.enc.json');
    if (pipe && pipe.pipeline) { DATA.board.pipeline = pipe.pipeline; DATA.pipeSyncPending = true; }
    var ev = await readWeb('events.enc.json');
    if (ev && ev.events) DATA.board.events = ev.events;
    var qq = await readWeb('questions.enc.json');
    if (qq && qq.questions) { DATA.board.questions = qq.questions; DATA.board.answered = qq.answered || []; }
    var rc = await readWeb('recurring.enc.json');
    if (rc && rc.recurring) DATA.board.recurring = rc.recurring;
    var to = await readWeb('taskops.enc.json');
    DATA.webOps = (to && to.ops) || [];
  } catch(e) { DATA.webOps = DATA.webOps || []; }
  DATA.pending = mergeOps(DATA.pending, (DATA.pendingOps || []).concat(DATA.webOps || []));
  var sig = JSON.stringify([DATA.updated, DATA.pending, DATA.done, DATA.board]);
  var first = !document.getElementById('shell');
  if (first) { shell(); setTimeout(restoreScroll, 50); }
  else if (sig === LAST_SIG && !force) return;   // 変わっていなければ何もしない
  LAST_SIG = sig;
  setTimeout(carryOver, 0);
  renderHeader(); renderBoard(); Office.update(); Bulk.render();
  if (!Memo.loaded) Memo.load();
}

(function(){

    var nav = document.querySelector('.tabs'); if (!nav) return;

    function twoInfo(){ var l = list(), a = l[0], b = l[1]; return {d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x), cx: (a.x + b.x)/2, cy: (a.y + b.y)/2}; }
    canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    canvas.addEventListener('pointerdown', function(e){
      pts[e.pointerId] = {x:e.clientX, y:e.clientY};
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      camGoal = null;
      if (list().length >= 2) { var t = twoInfo(); two = {d:t.d, ang:t.ang, cx:t.cx, cy:t.cy, r:cam.r, az:cam.az}; one = null; autoSpin = false; return; }
      one = {x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, moved:false, rotate: e.button === 2 || e.shiftKey, az:cam.az, el:cam.el};
    });
    function lift(e){ delete pts[e.pointerId]; if (list().length < 2) two = null; }
    canvas.addEventListener('pointercancel', function(e){ lift(e); one = null; canvas.classList.remove('drag'); });
    canvas.addEventListener('pointermove', function(e){
      if (!pts[e.pointerId]) return;
      pts[e.pointerId] = {x:e.clientX, y:e.clientY};
      if (two && list().length >= 2) {
        var t = twoInfo();
        if (t.d > 0) cam.r = Math.max(8, Math.min(48, two.r * two.d / t.d));
        cam.az = two.az - (t.ang - two.ang);
        panBy(t.cx - two.cx, t.cy - two.cy); two.cx = t.cx; two.cy = t.cy;
        return;
      }
      if (!one) return;
      var dx = e.clientX - one.x, dy = e.clientY - one.y;
      if (!one.moved && Math.abs(dx) + Math.abs(dy) > 5) { one.moved = true; autoSpin = false; canvas.classList.add('drag'); }
      if (!one.moved) return;
      if (one.rotate) { cam.az = one.az - dx * .006; cam.el = Math.max(.25, Math.min(1.25, one.el + dy * .004)); }
      else { panBy(e.clientX - one.lx, e.clientY - one.ly); }
      one.lx = e.clientX; one.ly = e.clientY;
    });
    canvas.addEventListener('pointerup', function(e){
      var wasTwo = !!two;
      lift(e);
      canvas.classList.remove('drag');
      if (one && !one.moved && !wasTwo) pick(e);
      one = null;
    });
    root.querySelectorAll('.zoom button').forEach(function(b){
      b.onclick = function(){
        var z = b.dataset.z;
        if (z === 'all') { var rr = canvas.getBoundingClientRect(), pt = rr.width / rr.height < 1; cam.el = pt ? 1.12 : .62; camGoal = {tx:0, tz:-2.6, r:defaultR()}; autoSpin = true; select(null); return; }
        camGoal = {tx:cam.tx, tz:cam.tz, r: Math.max(8, Math.min(48, cam.r * (z === 'in' ? .8 : 1.25)))};
      };
    });
    canvas.addEventListener('wheel', function(e){ e.preventDefault(); cam.r = Math.max(8, Math.min(48, cam.r * (1 + Math.sign(e.deltaY) * .08))); camGoal = null; }, {passive:false});
  }

  function pick(e){
    var r = canvas.getBoundingClientRect();
    var v = new THREE.Vector2(((e.clientX - r.left)/r.width)*2-1, -((e.clientY - r.top)/r.height)*2+1);
    raycaster.setFromCamera(v, camera);
    var hits = raycaster.intersectObjects(scene.children, true);
    for (var i=0;i<hits.length;i++){ var dp = hits[i].object.userData.dept; if (dp && desks[dp]) return select(dp, true); }

  }

  function summary(){
    var c = count(), out = [];
    out.push('未完了は '+DATA.pending.length+' 件です。');
    if (c.stale) out.push('30日以上止まっているタスクを持つメンバーが '+c.stale+' 名います（赤く点滅）。');
    if (c.decision) out.push('あなたの返事を待っている確認事項があります（白川が挙手中）。');
    var n = nextEvent(); if (n) { var dd = Math.ceil((n.at - new Date())/86400000); out.push(n.title+'まで あと'+dd+'日です。'); }
    var top = DATA.pending.slice().sort(function(a,b){ return b.score - a.score; })[0];
    if (top) out.push('いちばん優先度が高いのは「'+top.content.slice(0,40)+(top.content.length>40?'…':'')+'」です。');
    return out;
  }

  // 上部のバッジはメンバー単位で数える
  function count(){
    var c = {stale:0, decision:0, working:0, idle:0, today:0};
    Object.keys(states).forEach(function(k){
      if (k[0] !== '@') return;
      var s = states[k];
      if (s.stale.length) c.stale++;
      if (s.qs.length) c.decision++;
      if (s.tasks.length) c.working++;
      if (s.today.length) c.today++;
    });
    return c;
  }

  // メンバーの状態：担当タスク・今日の予定・近い締切（白川は担当なしのタスクと確認事項も受け持つ）
  function personStates(){
    var out = {}, today = dayKey(0), soonEnd = dayKey(2), now = Date.now(), o = orgInfo();
    var events = (DATA.board && DATA.board.events) || [];
    [o.boss].concat(o.staff).forEach(function(n){
      var tasks = DATA.pending.filter(function(t){ return assigneeMatch(n, t); }).sort(function(a,b){ return b.score - a.score; });
      var mine = events.filter(function(e){ var w = whoOfEvent(e); return e.kind !== 'duty' && (n === '白川' ? (!w || w === '白川') : w === n); });
      var stale = tasks.filter(function(t){ return now - new Date(t.recorded) > STALE_DAYS*86400000; });
      var qs = n === '白川' ? ((DATA.board && DATA.board.questions) || []) : [];
      out['@'+n] = {person:n, tasks:tasks, qs:qs, stale:stale, products:[],
        today: mine.filter(function(e){ return e.date === today; }),
        soon: mine.filter(function(e){ return (e.kind === 'deadline' || e.kind === 'event') && e.date >= today && e.date <= soonEnd; }),
        state: stale.length ? 'stale' : qs.length ? 'decision' : tasks.length ? 'working' : 'idle'};
    });
    return out;
  }

  /* ---- 状態を反映（データ更新ごと） ---- */
  function update(){
    if (!DATA) return;
    states = personStates();
    if (teamOwner) Object.assign(states, deptStates(teamOwner, teamDepts(teamOwner)));
    if (!built) return;
    var accent = cssColor('--accent'), warn = cssColor('--warn'), urgent = cssColor('--urgent'), idle = cssColor('--idle');
    Object.keys(desks).forEach(function(k){
      var dk = desks[k], s = states[k];
      if (!s) return;
      dk.state = s.state; dk.hasQ = s.qs.length > 0; dk.isStale = s.stale.length > 0; dk.today = s.today.length > 0; dk.soon = s.soon.length > 0;
      dk.ring.material.color.copy(s.state === 'stale' ? urgent : s.state === 'decision' ? warn : dk.today ? new THREE.Color(0xE8A800) : s.state === 'working' ? accent : idle);
      dk.d.lidMat.emissive.copy(s.tasks.length ? accent : new THREE.Color(0)); dk.d.lidMat.emissiveIntensity = s.tasks.length ? .6 : 0;
      dk.d.paper.visible = s.tasks.length > 0 || s.products.length > 0;
      if (dk.line) dk.line.material.opacity = dk.person ? .7 : s.tasks.length ? .6 : .15;
      dk.label.className = 'nm ' + s.state + (dk.today ? ' today' : '') + (dk.person ? ' person' + (dk.isBoss ? ' boss' : '') + (teamOwner === dk.person ? ' open' : '') : '') + (selected === k ? ' sel' : '');
      dk.label.innerHTML = (dk.today ? '<span class="b now">今日</span>' : '') + esc(dk.title) + (s.tasks.length ? '<span class="b">'+s.tasks.length+'</span>' : '');
    });
    if (hintEl) hintEl.hidden = !!teamOwner;

    var c = count();
    hudEl.innerHTML =
      chip('today','今日の予定',c.today) + chip('stale','放置',c.stale) + chip('decision','確認待ち',c.decision) + chip('working','作業中',c.working) +
      '<button class="chip" data-s="__boss">全体の報告</button>';
    hudEl.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        var s = b.dataset.s;

        });
        if (!list.length) return;
        hudCycle[s] = ((hudCycle[s] == null ? -1 : hudCycle[s]) + 1) % list.length;
        select(list[hudCycle[s]], true);
      };
    });
    if (selected) select(selected, false);

  }

  function chip(s, l, n){ return '<button class="chip '+s+'" data-s="'+s+'"'+(n?'':' disabled')+'>'+l+' <span class="mono">'+n+'</span></button>'; }

  /* ---- アニメーション ---- */
  function scheduleLines(){
    var out = [], labels = ['今日', '明日'];
    [0,1].forEach(function(off){
      var key = dayKey(off), evs = eventsOn(key);
      var dn = dutyNames(key); if (dn.length) out.push(labels[off]+'の担当業務：'+dn.join('・')+'。');
      var work = evs.filter(function(e){ return e.kind !== 'duty'; }).sort(function(a,b){ return (a.time||'99').localeCompare(b.time||'99'); });
      if (work.length) out.push(labels[off]+'は '+work.map(function(e){ var w = whoOfEvent(e); return (e.time ? e.time+' ' : '')+(w ? '【'+w+'】' : '')+e.title; }).join(' → ')+' です。');
      else if (!off) out.push('今日は決まった予定がありません。優先度の高いタスクから進めましょう。');

  }

  function bubbleLines(){
    var lines = scheduleLines().concat(summary().slice(1));

    return lines.map(function(x){ return '白川：' + x; });

  // 書類が飛ぶ：チームを出していれば その人→チーム、出していなければ 佐藤→メンバー
  function spawnPlane(){
    var fromU, targets;
    if (teamOwner) {
      fromU = desks['@'+teamOwner];
      targets = teamKeys.filter(function(k){ return states[k] && states[k].tasks.length; });
    } else {
      fromU = desks['@'+orgInfo().boss];
      targets = Object.keys(desks).filter(function(k){ return k[0] === '@' && !desks[k].isBoss && states[k] && states[k].tasks.length; });
    }
    if (!fromU || !targets.length) return;
    var to = desks[targets[Math.floor(Math.random()*targets.length)]].group.position, hp = fromU.group.position;
    var m = new THREE.Mesh(new THREE.ConeGeometry(.16,.42,3), new THREE.MeshStandardMaterial({color:0xFFFFFF, emissive:0xFFFFFF, emissiveIntensity:.25}));
    m.castShadow = true; scene.add(m);
    planes.push({m:m, from:new THREE.Vector3(hp.x, hp.y+1.6, hp.z+.8), to:new THREE.Vector3(to.x,1.3,to.z+.8), t:0, dur:2.2 + Math.random()*.8});
  }

  var tmpV = new THREE.Vector3();
  function project(obj, y){
    tmpV.set(0,y,0); obj.localToWorld(tmpV); tmpV.project(camera);
    var r = canvas.getBoundingClientRect();
    return {x:(tmpV.x*.5+.5)*r.width, y:(-tmpV.y*.5+.5)*r.height, vis: tmpV.z < 1};
  }

  function frame(){
    if (!running) return;
    raf = requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, mo = REDUCED ? 0 : 1;

    if (autoSpin && mo) cam.az = Math.sin(t*.08) * .35;
    if (camGoal) {
      cam.tx += (camGoal.tx - cam.tx) * .06; cam.tz += (camGoal.tz - cam.tz) * .06; cam.r += (camGoal.r - cam.r) * .06;
      if (Math.abs(camGoal.tx - cam.tx) < .01 && Math.abs(camGoal.tz - cam.tz) < .01 && Math.abs(camGoal.r - cam.r) < .01) camGoal = null;
    }
    camera.position.set(cam.tx + cam.r*Math.sin(cam.az)*Math.cos(cam.el), cam.r*Math.sin(cam.el), cam.tz + cam.r*Math.cos(cam.az)*Math.cos(cam.el));
    camera.lookAt(cam.tx, .8, cam.tz);

    Object.keys(desks).forEach(function(k){
      var dk = desks[k], w = dk.w, p = t + dk.phase, st = dk.state;
      if (!st) return;
      // チームが現れる（ポンと拡大）
      if (dk.born != null) {
        var a = mo ? Math.min(1, Math.max(0, (t - dk.born) / .45)) : 1;
        var e = a < 1 ? 1 + 2.2*Math.pow(a-1,3) + 1.2*Math.pow(a-1,2) : 1;
        dk.group.scale.setScalar(Math.max(.01, e));
        if (a > .6) { dk.label.style.visibility = ''; if (dk.line) dk.line.visible = true; }
        if (a >= 1) dk.born = null;
      }
      var L = w.arms[0], R = w.arms[1];
      if (st === 'idle') {
        w.torso.rotation.x = -.12; w.head.rotation.y = Math.sin(p*.5)*.5*mo; w.head.rotation.x = -.1;
        L.rotation.x = -.15; R.rotation.x = -.15 - (Math.sin(p*.4) > .85 ? 1.6 : 0)*mo;
        L.rotation.z = R.rotation.z = 0;
      } else {
        var speed = dk.today ? 17 : dk.soon ? 13 : 5;
        w.torso.rotation.x = (dk.today ? .16 : .08) + Math.sin(p*2)*.01*mo; w.head.rotation.x = .18 + Math.sin(p*3)*.03*mo; w.head.rotation.y = dk.soon ? Math.sin(p*9)*.12*mo : 0;
        L.rotation.x = -1.15 + Math.sin(p*speed)*.12*mo;
        R.rotation.x = -1.15 + Math.sin(p*speed + 1.6)*.12*mo;
        L.rotation.z = -.15; R.rotation.z = .15;
      }
      if (dk.hasQ) {
        R.rotation.x = -2.85; R.rotation.z = .25 + Math.sin(p*5)*.18*mo;
        w.head.rotation.y = Math.sin(p*1.3)*.25*mo; w.head.rotation.x = -.15;
      }
      dk.hand.visible = dk.hasQ; dk.hand.position.y = 2.55 + Math.sin(p*4)*.06*mo;
      dk.beam.visible = dk.spot.visible = !!dk.today; dk.beam.material.opacity = .16 + Math.sin(t*2 + dk.phase)*.05*mo;
      dk.sweat.visible = !!dk.soon; if (dk.soon) { var sw = (t*.7 + dk.phase) % 1; dk.sweat.position.y = 1.95 - sw*.35*mo; dk.sweat.material.opacity = 1 - sw*.8*mo; }
      dk.alert.visible = dk.isStale; dk.alert.material.opacity = mo ? (Math.sin(t*7) > 0 ? 1 : .25) : 1;
      // 服の色は変えない。放置は足元の赤い輪と「!」で知らせる
      dk.ring.material.opacity = st === 'stale' ? .85 : .5;
      var lp = project(dk.group, dk.isBoss ? 3.1 : 3.05);
      dk.label.style.left = lp.x+'px'; dk.label.style.top = lp.y+'px'; dk.label.style.display = lp.vis ? '' : 'none';
    });

    bubbleT -= dt;
    if (bubbleT <= 0) { var lines = bubbleLines(); bubbleEl.textContent = lines[bubbleIdx++ % lines.length]; bubbleT = 5; var tk = root.querySelector('#office-ticker'); if (tk) tk.textContent = bubbleEl.textContent; }
    bubbleEl.style.top = (hudEl.offsetTop + hudEl.offsetHeight + 8) + 'px';

    if (mo) { planeT -= dt; if (planeT <= 0) { spawnPlane(); planeT = 1.4 + Math.random(); } }
    for (var i = planes.length-1; i >= 0; i--) {
      var pl = planes[i]; pl.t += dt / pl.dur;
      if (pl.t >= 1) { scene.remove(pl.m); pl.m.geometry.dispose(); planes.splice(i,1); continue; }
      var pos = pl.from.clone().lerp(pl.to, pl.t); pos.y += Math.sin(pl.t*Math.PI) * 2.2;
      var ahead = pl.from.clone().lerp(pl.to, Math.min(1, pl.t+.02)); ahead.y += Math.sin(Math.min(1,pl.t+.02)*Math.PI) * 2.2;
      pl.m.position.copy(pos); pl.m.lookAt(ahead); pl.m.rotateX(Math.PI/2);
    }

    renderer.render(scene, camera);
  }

  function start(){
    if (!window.THREE) { root.querySelector('.office').innerHTML = '<p class="msg">3D表示のライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。</p>'; return; }
    if (!built && DATA) { build(); update(); }

  }
  function stop(){ running = false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); else if (tab === 'office') start(); });

  return {mount:mount, start:start, stop:stop, update:update};
})();

    });
  }
  document.addEventListener('click', function(e){ var m = document.getElementById('dotmenu'); if (m && !m.hidden && !m.contains(e.target)) m.hidden = true; });
  document.addEventListener('keydown', function(e){ var m = document.getElementById('dotmenu'); if (e.key === 'Escape' && m) m.hidden = true; });

  async function save(code, j, v){

    try {
      await savePipeline(function(base){ base.forEach(function(x){ if (x.code === code) { x.s = x.s.slice(); x.s[j] = v; } }); }, 'update pipeline');

/* =====================================================================

   ===================================================================== */
var Bulk = (function(){
  var root, who = '', items = null;
  var STAGE_WORDS = [
    ['撮影', /撮影|撮る|ロケ|物撮り/],
    ['画像', /画像|レタッチ|楽天用|白抜き|サムネ/],
    ['LP', /LP|ＬＰ|ページ|説明文|タイトル|文章/],
    ['登録', /登録|在庫|Shopify|ショッピファイ|ネクストエンジン|カタログ/],
    ['販促', /告知|販促|メルマガ|LINE|ライン|SNS|クラファン|広告/],
    ['企画', /企画|サンプル|設計/]
  ];
  var CAT_WORDS = [
    ['事務・受注・発注', /発注|受注|問い合わせ|問合せ|欠品|事務/],
    ['動画', /動画|ムービー/],
    ['撮影', /撮影|撮る/],
    ['商品画像', /画像|レタッチ|サムネ/],
    ['LP・文章', /LP|ＬＰ|説明文|タイトル|文章|ページ/],
    ['商品登録・在庫', /登録|在庫|Shopify|ネクストエンジン|カタログ/],
    ['販促・SNS・イベント', /告知|販促|メルマガ|LINE|SNS|クラファン|イベント|広告/],
    ['企画・サンプル', /企画|サンプル|提案|設計/],
    ['アプリ開発', /アプリ|ツール|開発|システム/]
  ];

  function d0(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function isWork(d){ var w = d.getDay(); return w !== 0 && w !== 6 && !isDutyDay(ymd(d), who); }  // 担当者の当番日は外す
  function workDays(from, to){
    var out = [], t = d0(), d = new Date(Math.max(from, t));
    for (; d <= to && out.length < 40; d = addDays(d, 1)) if (isWork(d)) out.push(ymd(d));
    if (!out.length) { d = new Date(Math.max(to, t)); for (var i = 0; i < 14; i++) { d = addDays(d, 1); if (isWork(d)) { out.push(ymd(d)); break; } } }
    return out;
  }
  // 行から期間を読み取る：今日／明日／今週（中）／来週／M/Dまで。なければ今週
  function windowOf(line){
    var t = d0(), dow = (t.getDay() + 6) % 7, fri = addDays(t, 4 - dow), mon2 = addDays(t, 7 - dow);
    var m = line.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/);
    if (m) { var y = t.getFullYear(), dd = new Date(y, +m[1]-1, +m[2]); if (dd < t) dd = new Date(y+1, +m[1]-1, +m[2]); return {key:'d'+ymd(dd), label: jpDate(dd)+'まで', days: workDays(t, dd)}; }
    if (/明後日/.test(line)) return {key:'a2', label:'明後日', days: workDays(addDays(t,2), addDays(t,2))};
    if (/明日/.test(line)) return {key:'a1', label:'明日', days: workDays(addDays(t,1), addDays(t,1))};
    if (/今日|本日/.test(line)) return {key:'a0', label:'今日', days: workDays(t, t)};
    if (/来週/.test(line)) return {key:'nw', label:'来週', days: workDays(mon2, addDays(mon2, 4))};
    if (dow >= 5) return {key:'nw', label:'来週', days: workDays(mon2, addDays(mon2, 4))};
    return {key:'tw', label:'今週', days: workDays(t, fri)};
  }

  // 文章の近さ（2文字ずつの重なり）。記号・空白は無視
  function norm(x){ return String(x || '').toLowerCase().replace(/[\s・\-ー－、。，．,.:：()（）【】\[\]「」]/g, ''); }
  function similar(a, b){
    a = norm(a); b = norm(b);
    if (!a || !b) return 0;
    if (a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return 1;
    var bg = function(x){ var m = {}; for (var i = 0; i < x.length - 1; i++) { var k = x.substr(i, 2); m[k] = (m[k] || 0) + 1; } return m; };
    var A = bg(a), B = bg(b), inter = 0, na = 0, nb = 0, k;
    for (k in A) { na += A[k]; if (B[k]) inter += Math.min(A[k], B[k]); }
    for (k in B) nb += B[k];
    return na + nb ? 2 * inter / (na + nb) : 0;
  }
  // 同じ品番で同じ工程の未完了タスク、または内容がほぼ同じタスクを探す
  function findDup(it){
    var list = DATA.pending || [];
    if (it.code) return list.filter(function(t){ return t.category === it.category && t.content.toLowerCase().indexOf(it.code) >= 0; })[0] || null;
    var best = null, bs = 0;
    list.forEach(function(t){ var sc = similar(t.content, it.content); if (sc > bs) { bs = sc; best = t; } });
    return bs >= .6 ? best : null;
  }

  // 休みの行：日付（10/12、10/12〜10/14、今日／明日／明後日）を読み取り、その日を休みにする
  function offItem(line, li){
    var t = d0(), days = [], y = t.getFullYear();
    function dt(m, d){ var x = new Date(y, m - 1, d); if (x < addDays(t, -60)) x = new Date(y + 1, m - 1, d); return x; }
    var rg = line.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?\s*[〜～\-ー－から]+\s*(?:(\d{1,2})\s*[\/月]\s*)?(\d{1,2})/);
    if (rg) {
      var a = dt(+rg[1], +rg[2]), b = dt(rg[3] ? +rg[3] : +rg[1], +rg[4]);
      for (var d = new Date(a); d <= b && days.length < 31; d = addDays(d, 1)) days.push(ymd(d));
    } else {
      var all = line.match(/\d{1,2}\s*[\/月]\s*\d{1,2}/g) || [];
      all.forEach(function(x){ var m = x.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/); days.push(ymd(dt(+m[1], +m[2]))); });
      if (!days.length) days.push(ymd(/明後日/.test(line) ? addDays(t, 2) : /明日/.test(line) ? addDays(t, 1) : t));
    }
    var kind = /午前|AM/i.test(line) ? '午前休' : /午後|PM/i.test(line) ? '午後休' : (line.match(/有給|有休|代休|半休|欠勤|公休|振休|休暇/) || ['休み'])[0];
    return {line:li, off:true, half: /午前休|午後休|半休/.test(kind), title: kind === '有休' ? '有給' : kind, days: days, who: who, content: line, label:'通常', win:{label:'休み'}, mode:'new'};
  }

  function parse(text){
    var stages = (DATA.board && DATA.board.stages) || ['企画','撮影','画像','LP','登録','販促'];
    var pipe = (DATA.board && DATA.board.pipeline) || [], out = [];
    text.split(/\r?\n/).map(function(l){ return l.replace(/^\s*([・\-\*•●◦]|\d+[\.\)．、])\s*/, '').trim(); }).filter(Boolean).forEach(function(line, li){
      if (/有給|有休|休み|休暇|代休|半休|欠勤|公休|振休|午前休|午後休|AM休|PM休/i.test(line)) { out.push(offItem(line, li)); return; }
      var win = windowOf(line), label = /今週中|急ぎ|至急|大至急/.test(line) ? '優先' : '通常';
      // 品番：登録済みの品番を優先して探し（長いものから）、残りから新しい品番を読み取る（ab- 付き・-2set 付きなども）
      var codes = [], rest = line.toLowerCase();
      pipe.map(function(x){ return x.code; }).sort(function(a, b){ return b.length - a.length; }).forEach(function(c){
        var lc = c.toLowerCase(); if (!lc) return;
        // 前後が英数字・ハイフンで続くときは別の品番（例：lw515 と ab-lw515 は別物）
        var esc2 = lc.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');
        var re = new RegExp('(^|[^a-z0-9-])' + esc2 + '(?![a-z0-9])');
        if (re.test(rest)) { codes.push(c); rest = rest.replace(new RegExp('(^|[^a-z0-9-])' + esc2 + '(?![a-z0-9])', 'g'), '$1 '); }
      });
      (rest.match(/[a-z]{2}(?:-[a-z]{2})?\d{3}(?:-(?:[a-z]{2}-)?[a-z]{2}\d{3})*(?:-\d+set)?/g) || []).forEach(function(c){ if (codes.indexOf(c) < 0) codes.push(c); });
      var sw = STAGE_WORDS.filter(function(x){ return x[1].test(line); })[0];
      if (codes.length) {
        codes.forEach(function(code){
          var item = pipe.filter(function(x){ return x.code === code; })[0], j;
          if (sw) j = stages.indexOf(sw[0]);
          else if (item) { j = (item.s || []).findIndex(function(x){ return x !== 'done'; }); if (j < 0) j = stages.length - 1; }

          var stage = stages[j];
          out.push({line:li, code:code, isNew:!item, name: item ? item.name : '', stageIdx:j, stage:stage,
            category: STAGE_CAT[stage] || 'その他', content: code + (item ? ' ' + item.name : '') + '：' + stage + '（' + line + '）',

        });
      } else {
        var cw = CAT_WORDS.filter(function(x){ return x[1].test(line); })[0];
        out.push({line:li, code:null, category: cw ? cw[0] : 'その他', content: line, label:label, who:who, win:win, title: line.length > 24 ? line.slice(0,24) + '…' : line, icon: guessIcon(line, '')});
      }

    var groups = {};
    out.forEach(function(it){ if (it.off) return; (groups[it.win.key] = groups[it.win.key] || []).push(it); });  // 休みは割り振らない
    Object.keys(groups).forEach(function(k){
      var g = groups[k], D = g[0].win.days.length, n = g.length;

        else it.days = [g[0].win.days[Math.floor(i*D/n)]];
